<!doctype html>
<html lang="bn" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@400;700&family=Tiro+Bangla&display=swap">
<title>যাত্রাপথ বাংলা উপন্যাস</title>
<link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest">
<style>/* ===== যাত্রাপথ — স্টাইল (গল্পনীড় ডিজাইন অনুসরণে; অধ্যায় লাল) ===== */
:root{
  --bg:#f5f2ec;--card:#ffffff;--card2:#f0ece4;--text:#1b1917;--muted:#6f6a63;--line:#e1dbd0;
  --pur:#6a4fd1;--pur-soft:#d9cffb;--pur-on:#1d1240;
  --red:#c4262c;--red2:#a11d22;--on-red:#fff;
  --teal:#13857c;--pill:#dfe3f5;
  --ok-bg:#d9eed7;--ok-fg:#276a2a;--done-bg:#ece0c6;--done-fg:#6a4b12;
  --feat1:#1b2740;--feat2:#24365b;
  --shadow:0 1px 4px rgba(0,0,0,.12);
  --navh:74px;
  --rbg:#ffffff;--rtext:#1b1917;
}
html[data-theme=dark]{
  --bg:#121212;--card:#171717;--card2:#1f1f1f;--text:#f2f2f2;--muted:#a6a6a6;--line:#2b2b2b;
  --pur:#6f55d6;--pur-soft:#b9a2ff;--pur-on:#160c34;
  --red:#c4262c;--red2:#a11d22;
  --teal:#4fc3b8;--pill:#2c3050;
  --ok-bg:#16301a;--ok-fg:#9fdc9b;--done-bg:#3a2f14;--done-fg:#e8cf8f;
  --feat1:#14203a;--feat2:#1a2a4d;
  --shadow:0 2px 8px rgba(0,0,0,.5);
  --rbg:#121212;--rtext:#ececec;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);overflow-x:hidden;max-width:100%}
body{font-family:'Noto Sans Bengali','Hind Siliguri','Kalpurush','SolaimanLipi',system-ui,sans-serif;line-height:1.5;font-size:15px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:disabled{cursor:default}
a{color:inherit;text-decoration:none}
img{max-width:100%}
svg{display:block}
input,textarea,select{font:inherit;color:inherit}

/* ----- কাঠামো ----- */
.app{max-width:720px;margin:0 auto;min-height:100vh;padding-bottom:calc(var(--navh) + 20px + env(safe-area-inset-bottom))}
body.has-mini .app{padding-bottom:calc(var(--navh) + 88px + env(safe-area-inset-bottom))}
body.sub .app{padding-bottom:28px}
body.sub .nav,body.sub .mini{display:none!important}
body.reading{background:var(--rbg);color:var(--rtext)}
body.reading .app{padding-bottom:calc(120px + env(safe-area-inset-bottom));max-width:760px}
.page{padding:6px 14px 12px}
.loading{text-align:center;color:var(--muted);padding:40px 0}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:20px;text-align:center;color:var(--muted)}
.errbox{margin:24px 16px;background:var(--card);border:1px solid var(--red);border-radius:14px;padding:18px;text-align:center}
.errbox p{margin:0 0 12px}

/* ----- হেডার ----- */
.hdr{position:sticky;top:0;z-index:20;background:var(--bg);padding:6px 10px 4px}
.hdr-row{display:flex;align-items:center;gap:2px;height:48px}
.hdr-title{flex:1;min-width:0;font-weight:700;font-size:18px;padding:0 4px}
.hdr-title span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand{flex:1;display:flex;align-items:center;gap:8px;min-width:0;font-weight:700;font-size:20px;padding-left:2px}
.brand img{width:34px;height:34px;border-radius:9px;object-fit:cover;background:#000;flex:0 0 auto}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;color:var(--text);flex:0 0 auto;position:relative}
.icon-btn:active{background:var(--card2)}
.icon-btn svg{width:23px;height:23px}
.bell em{position:absolute;top:3px;right:1px;min-width:17px;height:17px;border-radius:9px;background:#e53935;color:#fff;font-style:normal;font-size:11px;line-height:17px;text-align:center;padding:0 4px}
.searchbar{display:flex;gap:8px;margin:4px 4px 6px}
.searchbar input{flex:1;min-width:0;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--card);padding:0 16px;outline:none}
.searchbar input:focus{border-color:var(--pur)}
.searchbar button{height:44px;padding:0 18px;border-radius:22px;background:var(--pur);color:#fff;font-weight:600}
.tabs{display:flex;border-bottom:1px solid var(--line);margin:0 4px}
.tabs button{flex:1;padding:12px 4px;font-weight:600;color:var(--muted);position:relative}
.tabs button.on{color:var(--text)}
.tabs button.on::after{content:'';position:absolute;left:18%;right:18%;bottom:-1px;height:3px;border-radius:2px;background:var(--pur-soft)}

/* ----- সাধারণ ----- */
.cover{aspect-ratio:2/3;border-radius:8px;overflow:hidden;background:var(--card2);flex:0 0 auto;position:relative}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.btn{background:var(--red);color:var(--on-red);border-radius:12px;padding:11px 20px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn.pur{background:var(--pur);color:#fff}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn.on{background:var(--card2);color:var(--text);border:1px solid var(--red)}
.btn svg{width:19px;height:19px}
.btn[disabled]{opacity:.45}
.btn.wa{background:#1fa855;color:#fff}
.link-btn{color:var(--pur-soft);font-weight:600;font-size:14px;padding:4px 2px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.chip{padding:8px 20px;border-radius:12px;background:var(--card2);font-size:15px;font-weight:600;border:1px solid var(--line)}
.chip.on{background:var(--pur-soft);color:var(--pur-on);border-color:var(--pur-soft)}
.pill{display:inline-block;padding:2px 10px;border-radius:7px;font-size:12px;border:1px solid var(--line);background:var(--card2);white-space:nowrap}
.pill.run{background:var(--ok-bg);color:var(--ok-fg);border-color:transparent}
.pill.done{background:var(--done-bg);color:var(--done-fg);border-color:transparent}
.pill.demo{background:#322a4a;color:#cfc3f2;border-color:transparent}
.ey{display:inline-grid;place-items:center}.ey svg{width:15px;height:15px}
.stats{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.stats .sep{width:1px;height:14px;background:var(--line)}
.stats span{display:inline-flex;align-items:center;gap:4px}
.star{color:#f5b301}
.sec-title{display:flex;justify-content:space-between;align-items:center;margin:20px 0 10px}
.sec-title h3{margin:0;font-size:20px;display:flex;align-items:center;gap:10px}
.sec-title h3::before{content:'';width:4px;height:22px;background:var(--red);border-radius:1px}
.more{font-weight:700;font-size:14px;color:var(--bg);background:var(--text);padding:6px 14px;border-radius:16px}
.nohdr.page{padding-top:16px}.tabs.nohdr{margin-top:10px}
.fltb{display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px;padding:7px 14px;border-radius:18px;background:var(--card2);color:var(--text);margin-left:auto}
.fltb svg{width:18px;height:18px}.fltb em{font-style:normal;color:var(--red)}
.fopt{display:flex;align-items:center;justify-content:space-between;width:100%;padding:15px 16px;border-radius:14px;background:var(--card2);color:var(--text);font-size:16px;font-weight:600;margin-bottom:10px;text-align:left}
.fopt.on{box-shadow:inset 0 0 0 2px var(--red)}.fopt svg{width:20px;height:20px;color:var(--red)}

/* ----- কার্ড (কার্ড ভিউ) ----- */
.books.list{display:flex;flex-direction:column;gap:12px}
.bcard{display:flex;gap:12px;padding:12px;border-radius:18px;background:var(--card);cursor:pointer;position:relative}
.bcard .cover{width:84px}
.bcard .bi{min-width:0;flex:1;display:flex;flex-direction:column;gap:4px;justify-content:center}
.bcard .bt{font-weight:700;font-size:16px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.bcard .ba{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bcard .brow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.newb{position:absolute;top:0;left:0;background:var(--red);color:#fff;font-size:11px;font-weight:700;padding:1px 8px;border-radius:8px 0 8px 0;z-index:1}
.books.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 10px}
.books.grid .bkc{width:100%;max-width:none;min-width:0;border-radius:18px}
.gcard{cursor:pointer;min-width:0}
.gcard .cover{width:100%}
.gcard .gt{font-size:14px;font-weight:600;margin-top:6px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.gcard .ga{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcard .gm{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px;margin-top:2px}
.hp{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center}
.hp svg{width:15px;height:15px}
.rail{display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;padding-bottom:4px;scrollbar-width:none;overscroll-behavior-x:contain}
.rail::-webkit-scrollbar{display:none}
.rail .bcard{flex:0 0 min(88%,360px);scroll-snap-align:start}
.rail.g3 .gcard{flex:0 0 31%;scroll-snap-align:start}

/* ----- হোম: নির্বাচিত ----- */
.rail.feat{margin:6px -14px 4px;padding:0 5%;gap:12px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.rail.feat .fcard{flex:0 0 90%;scroll-snap-align:center;scroll-snap-stop:always;}
.fcard{position:relative;flex:0 0 100%;scroll-snap-align:start;display:flex;gap:16px;align-items:center;padding:16px;border-radius:22px;color:#fff;background:linear-gradient(135deg,var(--feat1),var(--feat2));cursor:pointer;min-height:176px}
.fcard .cover{width:100px;border-radius:8px;box-shadow:0 3px 10px rgba(0,0,0,.45)}
.fcard .finfo{min-width:0;flex:1}
.fcard .ft{font-size:21px;font-weight:700;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.fcard .fa{font-size:16px;margin-top:6px;opacity:.95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.fbtn{display:inline-flex;align-items:center;gap:6px;padding:9px 24px;border-radius:22px;background:var(--pur);color:#fff;font-weight:700;font-size:15px}
.fbtn svg{width:17px;height:17px}
.fbtn.alt{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35)}

/* ----- নিচের বার ও মিনি ----- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--bg);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
.nav [data-nav]{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12.5px;font-weight:600;color:var(--text);padding:0}
.nav .ico{width:64px;height:32px;border-radius:16px;display:grid;place-items:center;color:var(--muted)}
.nav .ico svg{width:24px;height:24px}
.nav [data-nav].on .ico{background:var(--pill);color:var(--teal)}
.mini{position:fixed;left:12px;right:12px;bottom:calc(var(--navh) + 8px + env(safe-area-inset-bottom));z-index:29;max-width:696px;margin:0 auto;background:var(--card2);border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:8px 10px;overflow:hidden}
.mini[hidden]{display:none}
.mini-bar{position:absolute;left:0;bottom:0;height:3px;background:var(--pur-soft)}
.mini-cover{width:40px;flex:0 0 auto;aspect-ratio:1/1;border-radius:6px;overflow:hidden;cursor:pointer;background:var(--card)}
.mini-cover img{width:100%;height:100%;object-fit:cover;display:block}
.mini-txt{flex:1;min-width:0;cursor:pointer}
.mini-txt .mt{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-txt .ms{font-size:12px;color:var(--pur-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-pct{font-size:12px;color:var(--muted)}
.mini-x{width:32px;height:32px;display:grid;place-items:center;color:var(--teal);flex:0 0 auto}
.mini-x svg{width:18px;height:18px}

/* ----- নতুন পর্ব ট্যাব ----- */
.eps{display:flex;flex-direction:column;gap:12px}
.ep{display:flex;align-items:center;gap:8px;padding:14px 14px;border-radius:16px;background:var(--card)}
.ep .et{flex:1;min-width:0;text-align:left;cursor:pointer}
.ep .et b{display:block;font-size:16px;line-height:1.35}
.ep .em{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.ep .em span{display:inline-flex;align-items:center;gap:4px}
.freshb{border:1px solid var(--red);color:#ff8f94;background:rgba(196,38,44,.18);padding:0 8px;border-radius:5px;font-size:12px}
html:not([data-theme=dark]) .freshb{color:var(--red2)}
.ep .dlb{width:40px;height:40px;display:grid;place-items:center;color:var(--teal);flex:0 0 auto}
.ep .dlb svg{width:22px;height:22px}

/* ----- বইয়ের বিস্তারিত ----- */
.detail{display:flex;gap:14px;margin:8px 0 14px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px}
.detail .cover{width:104px;flex:0 0 104px;border-radius:10px}
.detail .di{min-width:0;flex:1}
.detail h1{margin:0;font-size:21px;line-height:1.3}.detail h1 .lbl{font-weight:700}.detail .pr .dh{font-weight:700}.detail .pr{align-items:center;font-size:15px}
.detail .au{display:flex;align-items:center;gap:6px;color:var(--teal);margin-top:6px;font-size:15px}
.detail .au svg{width:15px;height:15px}
.detail .pr{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.bm{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:15px;color:var(--text);text-align:left}
.bm svg{width:18px;height:18px;color:var(--teal)}
.bm.on svg{fill:var(--teal)}
.phd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.phd h3{margin:0}.pbt{display:flex;gap:10px}
.cbt{position:relative;width:46px;height:46px;border-radius:50%;background:var(--card2);color:var(--text);display:grid;place-items:center;flex:0 0 auto}.cbt svg{width:22px;height:22px}
.cbt.on{background:var(--red);color:var(--on-red)}.cbt.on svg{fill:currentColor}.cbt.busy{opacity:.6;pointer-events:none}
.cbg{position:absolute;top:-5px;right:-5px;background:var(--red);color:#fff;font-style:normal;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:10px;min-width:18px;text-align:center}
.btabs{display:flex;margin-top:14px;border-bottom:1.5px solid var(--line)}.btabs button{flex:1;padding:13px 6px;font-weight:700;font-size:15px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1.5px}.btabs button.on{color:var(--text);border-bottom-color:var(--pur,#8b5cf6)}
.rvform{background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:14px}.rvform h3{margin:0 0 10px;font-size:17px}.rvform.done{text-align:center;font-weight:700;color:var(--teal)}
.rvst{display:flex;gap:6px;margin-bottom:10px}.rvst button{font-size:38px;line-height:1;color:var(--muted);opacity:.55;padding:2px 3px}.rvst button.on{color:#ffc107;opacity:1}
.rvform textarea{width:100%;box-sizing:border-box;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:12px;font:inherit;font-size:15px;line-height:1.5;resize:vertical}
.rvcnt{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:6px 2px 4px}
.rvh3{font-size:17px;margin:6px 2px 10px}.rvh3 small{color:#e0a100;font-size:14px;margin-left:6px}
.rvi{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}.rvh{display:flex;align-items:center;gap:10px}.rvh .sav{width:40px;height:40px;flex:0 0 auto}.rvn{flex:1;min-width:0}.rvn b{display:block;font-size:15px;color:var(--text)}.rvh small{color:var(--muted);font-size:12px;flex:0 0 auto}
.rvi p{margin:8px 0 0;line-height:1.6;font-size:15px;color:var(--text);word-break:break-word}
.stz i{font-style:normal;color:var(--line);font-size:15px}.stz i.on{color:#ffc107}
.cmr{margin-top:8px;padding:8px 10px;border-left:3px solid var(--red);background:var(--card);border-radius:8px}.cmr small{color:var(--muted);font-size:12px}.cmr .lk{background:var(--red);color:#fff;font-size:11px;font-weight:700;padding:1px 8px;border-radius:9px;margin-right:6px}.cmr p{margin:4px 0 0!important}
.bstats{display:flex;gap:24px;margin-top:12px}.bstats small{display:block;color:var(--muted);font-size:12.5px}.bstats b{font-size:17px;font-weight:700}
.icon-btn.bmh svg{width:22px;height:22px}.icon-btn.bmh.on{color:var(--teal)}.icon-btn.bmh.on svg{fill:var(--teal)}
.reacts{display:flex;gap:8px;margin:10px 0 4px}
.reacts .btn{padding:8px 16px;font-size:14px}
.startrow{display:flex;gap:10px;margin:14px 0 6px}
.startrow .btn{flex:1;font-size:16px;padding:13px 10px}
.startrow .btn.pur{flex:1;background:#e84d73!important;color:#fff!important;border:0}
.startrow .dlall{border:1.5px solid #7a2a36!important;background:transparent!important;color:var(--text)!important}.startrow .dlall.fin,.startrow .dlall.busy{color:#fff!important}
.bdesc{margin-top:8px;font-size:14px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.desc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:14px 0;line-height:1.75;font-size:14.5px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:14px}
.panel h3{margin:2px 0 12px;font-size:17px}
.panel .ch{transition:background .25s;background:var(--chbar,#b71c1c);display:flex;align-items:center;gap:4px;width:100%;text-align:left;color:#fff;border-radius:12px;padding:2px 6px 2px 0;margin-bottom:8px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.ch .chm{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;color:inherit;padding:8px 6px 8px 12px;background:none}
.ch .chn{flex:0 0 auto;width:32px;height:32px;border-radius:9px;background:rgba(0,0,0,.28);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px}
.ch .cht{flex:1;min-width:0}
.ch .cht b{display:block;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch .cht small{display:block;margin-top:2px;font-size:12px;opacity:.92}
.ch .cht small svg{width:15px;height:15px;vertical-align:-2px;margin-right:3px}
.ch .chdl{flex:0 0 auto;width:34px;height:34px;display:grid;place-items:center;color:#fff;border-radius:50%;background:rgba(0,0,0,.2)}
.ch .chdl svg{width:19px;height:19px}
.ch .chdl.done{background:rgba(255,255,255,.25)}
.ch .chdl:disabled{opacity:.6;pointer-events:none}
.panel .ch.rd{box-shadow:0 0 0 2px #fff inset,0 2px 8px rgba(0,0,0,.18)}
.panel .ch.rd .chn{background:rgba(0,0,0,.45)}
.ch.cur{box-shadow:0 0 0 2px #fff inset}

/* ----- লাইব্রেরি ----- */
.lib-item{display:flex;gap:12px;padding:12px;border-radius:16px;background:var(--card);margin-bottom:12px}
.lib-item .cover{width:74px;cursor:pointer}
.lib-item .li{flex:1;min-width:0;cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:3px}
.lib-item .lt{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lib-item .ls{font-size:13px;color:var(--muted)}
.lib-item .lr{display:flex;flex-direction:column;align-items:center;gap:8px;justify-content:center}
.saved-pill{background:var(--ok-bg);color:var(--ok-fg);font-size:12px;padding:3px 10px;border-radius:8px;white-space:nowrap}
.trash{width:34px;height:34px;border-radius:50%;background:#d32f2f;color:#fff;display:grid;place-items:center}
.trash svg{width:17px;height:17px}

/* ----- রিডার ----- */
.rtop{position:fixed;top:0;left:0;right:0;z-index:25;display:flex;align-items:center;gap:2px;padding:6px 8px;background:var(--rbg);max-width:760px;margin:0 auto;color:var(--rtext)}
.rtop .mid{flex:1;min-width:0;text-align:center;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtop .icon-btn{color:var(--rtext)}
.rtop .icon-btn.on{color:var(--red);background:rgba(196,38,44,.15)}
.reader{padding:66px 20px 10px}
.reader h2{margin:8px 0 22px;font-size:calc(var(--fs,20px) + 6px);text-align:center;line-height:1.35;font-family:var(--rfont,inherit)}
.reader .txt p{margin:0 0 var(--pg,12px);line-height:1.85;font-size:var(--fs,20px);font-family:var(--rfont,inherit);scroll-margin:140px 0}
.reader .txt p.spk{background:rgba(196,38,44,.22);border-radius:6px;box-shadow:0 0 0 4px rgba(196,38,44,.22)}
.rnav{display:flex;gap:10px;padding:10px 20px 18px;max-width:760px;margin:0 auto}
.rnav .btn{flex:1}.rnav .btn[disabled]{opacity:.4;pointer-events:none}
.rfoot{position:fixed;bottom:0;left:0;right:0;z-index:25;background:var(--rbg);max-width:760px;margin:0 auto;padding:8px 16px calc(8px + env(safe-area-inset-bottom));color:var(--rtext)}
.rprog{height:3px;border-radius:2px;background:rgba(128,128,128,.35);overflow:hidden}
.rprog u{display:block;height:100%;width:0;background:var(--red);text-decoration:none}
.rpct{font-size:11.5px;text-align:center;margin:6px 0 4px;opacity:.85}
.rbtns{display:flex;justify-content:space-between}
.rbtns button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:600;padding:2px 0}
.rbtns svg{width:22px;height:22px}
.spk-bar{position:fixed;left:12px;right:12px;bottom:calc(104px + env(safe-area-inset-bottom));z-index:26;max-width:736px;margin:0 auto;background:var(--red);color:#fff;border-radius:16px;box-shadow:0 4px 16px rgba(0,0,0,.4);display:flex;align-items:center;gap:4px;padding:6px 8px}
.spk-bar[hidden]{display:none}
.spk-bar .st{flex:1;font-size:13px;padding-left:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spk-bar button{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;color:#fff}
.spk-bar button svg{width:22px;height:22px}

/* ----- বটম শিট ও ড্রয়ার ----- */
.sheet-wrap,.drawer-wrap{position:fixed;inset:0;z-index:60}
.sheet-wrap[hidden],.drawer-wrap[hidden]{display:none}
.sheet-dim,.drawer-dim{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:720px;margin:0 auto;background:#1c1c1e;color:#f2f2f2;border-radius:26px 26px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));max-height:86vh;overflow-y:auto;animation:sh-up .22s ease-out}
html:not([data-theme=dark]) .sheet{background:#fff;color:#1b1917}
@keyframes sh-up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet .grab{width:44px;height:4px;border-radius:2px;background:#888;margin:2px auto 14px}
.sheet h3{margin:0 0 12px;font-size:21px;display:flex;align-items:center;gap:10px}
.sheet h3::before{content:'';width:3px;height:22px;background:var(--red)}
.sheet .sub{font-size:13px;color:var(--muted);margin:-4px 0 14px}
.stabs{display:flex;background:rgba(128,128,128,.16);border-radius:14px;padding:4px;margin-bottom:14px}
.stabs button{flex:1;padding:10px 2px;font-size:13.5px;font-weight:600;border-radius:10px;color:var(--muted)}
.stabs button.on{background:rgba(128,128,128,.28);color:inherit;box-shadow:inset 0 -2px 0 var(--red)}
.scard{background:rgba(128,128,128,.13);border-radius:16px;padding:14px;margin-bottom:12px}
.scard>.lbl{font-size:14px;font-weight:600;margin-bottom:10px;display:block}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.swatches{display:flex;gap:12px;overflow-x:auto;padding:2px}
.swatch{width:42px;height:42px;border-radius:50%;border:2px solid rgba(128,128,128,.5);flex:0 0 auto;display:grid;place-items:center;color:#c4262c}
.swatch.on{border-color:var(--red);box-shadow:0 0 0 2px var(--red)}
.swatch svg{width:18px;height:18px}
.step{display:flex;align-items:center;gap:10px}
.step button{width:42px;height:34px;border-radius:9px;background:#fff;color:#111;font-weight:700}
.step b{min-width:26px;text-align:center}
.fonts{display:flex;gap:8px;flex-wrap:wrap}
.fonts button{padding:9px 16px;border-radius:10px;background:#f1f1f1;color:#111;font-size:14px}
.fonts button.on{background:var(--red);color:#fff}
.sw{width:50px;height:28px;border-radius:14px;background:#555;position:relative;transition:background .15s;flex:0 0 auto}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.sw.on{background:var(--red)}.sw.on::after{transform:translateX(22px)}
.scard select,.scard textarea{width:100%;border-radius:10px;border:1px solid rgba(128,128,128,.4);background:rgba(128,128,128,.12);padding:12px;outline:none}
.scard textarea{min-height:84px;resize:vertical}
.scard input[type=range]{width:100%;accent-color:var(--red)}
.nitem{border-bottom:1px solid rgba(128,128,128,.25);padding:10px 0;font-size:14px;display:flex;gap:8px;align-items:flex-start}
.nitem:last-child{border:0}
.nitem p{margin:0;flex:1;white-space:pre-wrap;line-height:1.6}
.nitem button{color:#ff8a8a;font-size:13px}
.sheet .bigbtn{width:100%;background:var(--red);color:#fff;border-radius:12px;padding:14px;font-weight:700;font-size:17px;margin-top:6px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1.5px solid rgba(128,128,128,.4);border-radius:14px;padding:14px;margin-bottom:12px}
.opt.on{border-color:var(--red)}
.opt .oi{width:30px;color:var(--red)}.opt .oi svg{width:26px;height:26px}
.opt .ot{flex:1}.opt .ot b{display:block;font-size:16px}.opt .ot small{color:var(--muted);font-size:12.5px}
.opt .ck{width:26px;height:26px;border-radius:50%;border:2px solid rgba(128,128,128,.6);display:grid;place-items:center;color:#fff;flex:0 0 auto}
.opt.on .ck{background:var(--red);border-color:var(--red)}
.opt .ck svg{width:16px;height:16px}
.drawer{position:absolute;top:0;bottom:0;left:0;width:min(84vw,360px);background:#1c1c1e;color:#f2f2f2;overflow-y:auto;animation:dr-in .2s ease-out;z-index:2}
html:not([data-theme=dark]) .drawer{background:#fff;color:#1b1917}
@keyframes dr-in{from{transform:translateX(-30px);opacity:.4}to{transform:none;opacity:1}}
.drawer h4{margin:0;padding:18px 16px;background:var(--red);color:#fff;font-size:20px;position:sticky;top:0}
.drawer button.dch{display:block;width:100%;text-align:left;padding:16px;font-size:16px;border-bottom:1px solid rgba(128,128,128,.2)}
.drawer button.dch.cur{background:rgba(196,38,44,.22);font-weight:700;border-left:4px solid var(--red)}

/* ----- প্রোফাইল ----- */
.pcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.pcard.me{display:flex;align-items:center;gap:12px;justify-content:space-between}
.pcard.me .nm{font-size:20px;font-weight:700}
.pcard.me .chg{display:inline-block;margin-top:8px;padding:8px 14px;border-radius:10px;background:var(--card2);font-size:13px}
.pcard.me input{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card2);padding:0 12px;width:100%;margin-top:8px}
.avatar{object-fit:cover;width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#6a2fb3,#c4262c);color:#fff;display:grid;place-items:center;font-size:30px;font-weight:700;flex:0 0 auto}
.streak{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 10px;font-weight:700;font-size:17px}
.streak small{font-size:15px;font-weight:600}
.chart{height:190px;display:flex;align-items:flex-end;justify-content:space-around;padding:8px 0 0}
.chart .col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;flex:1}
.chart .bar{width:20px;border-radius:10px;background:var(--card2);border:1px solid var(--line);min-height:14px}
.chart .col.today .bar{background:var(--red);border-color:var(--red)}
.chart .v{font-size:11px;color:var(--muted)}
.chart .d{font-size:12px}
.grp{font-size:18px;font-weight:700;margin:18px 2px 10px}
.mrow{display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left;font-size:15.5px}
.mrow:last-child{border:0}
.mrow .mi{width:24px;color:var(--teal);flex:0 0 auto}.mrow .mi svg{width:22px;height:22px}
.mrow .mt{flex:1;min-width:0}.mrow .mt small{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.mrow .ar{color:var(--muted);width:16px}.mrow .ar svg{width:16px;height:16px}
.mrow .sw{background:#555}.mrow .sw.on{background:var(--pur)}
.mrow.danger .mi{color:#e53935}
.social{display:flex;justify-content:center;gap:14px;margin:12px 0 4px}
.social a{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;background:#1fa855}
.social svg{width:26px;height:26px}
.ver{display:flex;justify-content:space-between;padding:14px 4px;font-weight:600}

/* ----- অডিও ----- */
.player{background:linear-gradient(135deg,var(--feat1),var(--feat2));color:#fff;border-radius:22px;padding:16px;margin:8px 0 14px}
.player .pt{font-weight:700;font-size:17px;line-height:1.3}
.player .ps{font-size:13px;opacity:.8;margin-top:2px}
.player .seekrow{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:12px;font-variant-numeric:tabular-nums}
.player input[type=range]{flex:1;min-width:0;accent-color:#fff;height:28px}
.pctl{display:flex;align-items:center;justify-content:center;gap:22px;margin-top:6px}
.pctl button{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff}
.pctl button svg{width:24px;height:24px}
.pctl button[disabled]{opacity:.35}
.pctl .big{width:62px;height:62px;background:#fff;color:#1b2740}
.pctl .big svg{width:30px;height:30px}
.aep{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 10px;margin-bottom:8px}
.aep.cur{border-color:var(--red);background:var(--card2)}
.aep .play{width:40px;height:40px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;flex:0 0 auto}
.aep .play svg{width:18px;height:18px}
.aep .txt{flex:1;min-width:0;text-align:left}
.aep .at{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aep .as{font-size:12px;color:var(--muted)}
.aep .adl{flex:0 0 auto;min-width:40px;height:40px;border-radius:20px;display:grid;place-items:center;background:var(--card2);padding:0 10px;font-size:12px;gap:4px;grid-auto-flow:column}
.aep .adl svg{width:20px;height:20px}
.aep .adl.done{background:var(--ok-bg);color:var(--ok-fg)}

/* ----- নোটিশ, অ্যাপ সম্পর্কে, যোগাযোগ ----- */
.notice{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.notice.new{border-color:var(--red)}
.notice h4{margin:0 0 2px;font-size:16px}
.notice time{font-size:12px;color:var(--muted)}
.notice p{margin:8px 0 0;white-space:pre-wrap;line-height:1.7}
.info-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;line-height:1.75}
.about-logo{width:96px;height:96px;border-radius:22px;background:#000;object-fit:cover;display:block;margin:6px auto 10px}
.center{text-align:center}
.wa-num{font-size:24px;font-weight:700;letter-spacing:.5px;margin:6px 0 12px}

/* ----- বের হওয়ার সতর্কবার্তা ----- */
.dlg-wrap{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:20px}
.dlg-wrap[hidden]{display:none}
.dlg{width:min(100%,340px);background:var(--card);color:var(--text);border-radius:20px;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.5);border:1px solid var(--line)}
.dlg h4{margin:0 0 6px;font-size:18px}
.dlg p{margin:0 0 16px;color:var(--muted);line-height:1.6}
.dlg .row{display:flex;gap:10px}
.dlg .row .btn{flex:1}

/* ----- স্প্ল্যাশ ও টোস্ট ----- */
.splash{position:fixed;inset:0;z-index:100;background:var(--bg);color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;transition:opacity .3s}
.splash.hide{opacity:0;pointer-events:none}
.splash-wrap{position:relative;display:grid;place-items:center}
.splash-logo{width:128px;height:128px;border-radius:28px;background:#000;object-fit:cover;box-shadow:0 4px 18px rgba(0,0,0,.5);animation:sp-pop .7s cubic-bezier(.2,.9,.3,1.2) both}
.splash-ring{position:absolute;width:128px;height:128px;border-radius:32px;border:3px solid #c4262c;opacity:0;animation:sp-ring 1.6s .5s ease-out infinite;pointer-events:none}
.splash-name{font-size:30px;font-weight:700;margin-top:14px;animation:sp-up .6s .35s ease both}
.splash-tag{font-size:15px;color:var(--muted);animation:sp-up .6s .55s ease both}
.splash-spin{margin-top:26px;animation:sp-up .5s .75s ease both}
.splash-spin i{display:block;width:22px;height:22px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:#b9a2ff;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sp-pop{0%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:scale(1)}}
@keyframes sp-up{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:none}}
@keyframes sp-ring{0%{opacity:.5;transform:scale(1)}100%{opacity:0;transform:scale(1.45)}}
@media (prefers-reduced-motion:reduce){.splash-logo,.splash-name,.splash-tag,.splash-spin,.splash-ring,.splash-spin i{animation:none}}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#f2f2f2;color:#111;padding:9px 18px;border-radius:20px;font-size:14px;z-index:130;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88vw;text-align:center}
html:not([data-theme=dark]) .toast{background:#2b2118;color:#fff}
.toast.show{opacity:1}

/* ----- v2.1 আপডেট ----- */
.fav{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center}
.fav svg{width:20px;height:20px}.fav.on{background:#fff;color:var(--red)}.fav.on svg{fill:var(--red)}
.rtop .icon-btn svg{width:22px;height:22px}.rtop .icon-btn{width:38px;height:38px}
.rtop .icon-btn.on svg{fill:var(--red)}
.catgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.catc{position:relative;display:block;height:104px;border-radius:16px;overflow:hidden;text-align:left;color:#fff;width:100%}
.catc.all{height:112px;margin-bottom:4px}
.cart{position:absolute;inset:0;width:100%;height:100%}
.cshade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.6))}
.ct{position:absolute;left:12px;right:12px;bottom:9px;display:flex;flex-direction:column;line-height:1.25}
.ct b{font-size:17px;text-shadow:0 1px 4px rgba(0,0,0,.5)}.ct small{font-size:12.5px;opacity:.92}
.catc.all .ct b{font-size:21px}
.rail.catrail .catc{flex:0 0 150px;height:96px}
.dlg-ic{width:54px;height:54px;border-radius:16px;background:rgba(196,38,44,.16);color:var(--red);display:grid;place-items:center;margin:0 0 12px}
.dlg-ic svg{width:28px;height:28px}
.dlg .row .btn{padding:8px 12px;font-size:14px;border-radius:10px}
.dlg.center{text-align:center;width:min(100%,290px);padding:22px 18px 18px}.dlg.center .dlg-ic{margin:0 auto 6px;background:none;width:auto;height:auto;border-radius:0}.dlg-emo{font-size:46px;line-height:1}
.dlg.center h4{margin:4px 0 16px;font-size:17px}.dlg.center .row{justify-content:center;gap:12px}.dlg.center .row .btn{flex:0 0 auto;min-width:78px;padding:6px 16px;font-size:13px;border-radius:9px}
.accopts{padding:2px 0 8px 38px;display:flex;flex-direction:column;gap:8px}
.opt2{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--card2);text-align:left;font-size:15px}
.opt2 span:not(.pv){flex:1}.opt2 small{display:block;font-size:12px;color:var(--muted)}
.opt2 i{width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);flex:0 0 auto}
.opt2.on{outline:2px solid var(--pur-soft)}.opt2.on i{border-color:var(--pur-soft);background:radial-gradient(var(--pur-soft) 45%,transparent 50%)}
.pv{display:flex;flex-direction:column;gap:3px;width:34px}.pv u{display:block;height:11px;border-radius:3px;background:var(--muted);opacity:.7}
.pv.g{flex-direction:row;flex-wrap:wrap}.pv.g u{width:10px;height:14px}
.mrow .ar{transition:transform .2s}.mrow .ar.up{transform:rotate(90deg)}
.pcard.me .em{font-size:13px;color:var(--muted);margin-top:2px;word-break:break-all}
.row2{display:flex;gap:8px;flex-wrap:wrap}.chg.pr{background:var(--pur);color:#fff}
.pcard.me .chg{margin-top:8px}
.avatar.big{width:84px;height:84px;font-size:34px}
.phrow{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.sheet .scard input{width:100%;border-radius:10px;border:1px solid rgba(128,128,128,.4);background:rgba(128,128,128,.12);padding:12px;outline:none}
.acerr{color:#ff6b6b;font-weight:600;margin:4px 2px 8px;min-height:1px}
.tmrow{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.tmrow small{color:var(--muted);font-size:12.5px}.tm{font-size:24px;font-weight:700;line-height:1.2}
.tmr{text-align:right}.tmr b{font-size:15px}
.shhead{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 6px}
.shitem{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.shq{flex:1;display:flex;align-items:center;gap:12px;padding:13px 4px;text-align:left;min-width:0}
.shq svg{width:18px;height:18px;color:var(--muted);flex:0 0 auto}.shq span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shx{width:40px;height:40px;display:grid;place-items:center;color:var(--muted)}.shx svg{width:18px;height:18px}
.frow{flex-wrap:nowrap;gap:8px}.fbtn{padding:9px 16px}.fav{flex:0 0 auto;width:40px;height:40px}

/* ----- রিডার: কন্ট্রোল লুকানো, পড়ুন/শুনুন, প্লেয়ার, ফিড ----- */
.rchrome{position:fixed;top:0;left:0;right:0;z-index:25;max-width:760px;margin:0 auto;background:var(--rbg);color:var(--rtext);transition:transform .28s,opacity .28s}
.rchrome .rtop{position:static;max-width:none;padding:6px 8px 2px}
.rtop .mid{display:flex;flex-direction:column;line-height:1.25}

<style id="jp-motion">
/* ===== নির্বাচিত উপন্যাস: ভিডিওর অ্যাপের মতো কার্ড (পাশে পাশের কার্ডের একটু অংশ দেখা যায়) ===== */
.rail.feat{margin:6px -14px 2px;padding:2px 9% 6px;gap:10px;scroll-snap-type:x mandatory;scroll-padding:0 9%;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y}
.rail.feat .fcard{flex:0 0 82%;height:138px;min-height:0;padding:12px 14px;gap:14px;border-radius:20px;align-items:center;scroll-snap-align:center;scroll-snap-stop:always;
  background-image:linear-gradient(135deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%),linear-gradient(135deg,#0c1a33,#16294a);border:1px solid rgba(255,255,255,.06);box-shadow:0 8px 20px -12px rgba(0,0,0,.8);
  transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .35s}
.rail.feat .fcard:active{transform:scale(.975)}
.fcard .cover{width:76px;flex:0 0 76px;aspect-ratio:3/4;border-radius:10px}
.fcard .ft{font-size:17px;line-height:1.25;-webkit-line-clamp:1;font-weight:700}

.fcard .fs .ey svg{width:14px;height:14px}
.fcard .frow{margin-top:10px;gap:10px;flex-wrap:nowrap;align-items:center}
.fcard .fbtn,.fcard .fbtn:not(.alt){padding:7px 22px;font-size:14.5px;border-radius:20px;background-image:none;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.28);box-shadow:none}
.fcard .fav{width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22)}
.fcard .fav svg{width:18px;height:18px}
.fcard .rank{top:10px;right:12px;padding:2px 12px;font-size:12px;border-radius:12px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.25)}
.fdots{margin:6px 0 4px}

/* ===== ভিডিওর অ্যানিমেশন ===== */
@keyframes jp-cardin{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
@keyframes jp-fade{from{opacity:0}to{opacity:1}}
@keyframes jp-minin{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes jp-pop{0%{transform:scale(.8)}60%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes jp-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes jp-gfill{from{stroke-dasharray:0 100}}
@keyframes jp-grow{from{width:0}}
@keyframes jp-bell{0%,100%{transform:rotate(0)}20%{transform:rotate(14deg)}40%{transform:rotate(-12deg)}60%{transform:rotate(8deg)}80%{transform:rotate(-5deg)}}
.rail:not(.feat)>*{animation:jp-cardin .5s cubic-bezier(.2,.8,.2,1) both}
.rail:not(.feat)>*:nth-child(2){animation-delay:.05s}.rail:not(.feat)>*:nth-child(3){animation-delay:.1s}.rail:not(.feat)>*:nth-child(4){animation-delay:.15s}.rail:not(.feat)>*:nth-child(5){animation-delay:.2s}.rail:not(.feat)>*:nth-child(n+6){animation-delay:.25s}
.rail.feat .fcard{animation:jp-fade .5s ease both}
.sec-title{animation:jp-fade .5s ease both}
.rail:not(.feat) .bkc,.rail:not(.feat) .gcard,.books.grid .bkc,.ntc,.gbk{transition:transform .18s ease}
.rail:not(.feat) .bkc:active,.rail:not(.feat) .gcard:active,.books.grid .bkc:active,.ntc:active{transform:scale(.96)}
.mini:not([hidden]){animation:jp-minin .45s cubic-bezier(.2,.9,.3,1) both}
.nav [data-nav] .ico{transition:background .25s ease,color .25s ease,transform .2s}
.nav [data-nav]:active .ico{transform:scale(.9)}
.nav [data-nav].on .ico svg{animation:jp-pop .4s ease both}
.bell em:not([hidden]){animation:jp-pop .5s ease both}
.bell:not(:active) span[data-i]{transform-origin:50% 10%;animation:jp-bell 1.2s .8s ease both}
.fav.on svg{animation:jp-pop .35s ease both}
.icon-btn,.fbtn,.more,.btn{transition:transform .15s ease,background .2s}
.icon-btn:active,.fbtn:active,.more:active,.btn:active{transform:scale(.92)}
@media (prefers-reduced-motion:reduce){.rail>*,.mini,.gbk,.gline,.ggarc,.gdot,.gpb i,.gbb i{animation:none!important}}

/* ---------- অডিও ---------- */
// অডিও ট্যাবে শুধু বইয়ের তালিকা। অধ্যায় (পর্ব) ও প্লেয়ার থাকে বইয়ের ভেতরে। ডাউনলোড হয় পর্ব ধরে ধরে, পুরো বই নয়।
const player = new Audio(); player.preload = 'none';
let ap = null; let apBlobUrl = null;
const getAdl = () => store.get('jp_adl', {});
const getAcache = () => store.get('jp_acache', {});
const fmtT = (x) => { if (!isFinite(x) || x < 0) x = 0; const m = Math.floor(x / 60); const r = Math.floor(x % 60); return bn(m) + ':' + bn(r < 10 ? '0' + r : r); };
function idb() {
  return new Promise((res, rej) => {
    try { const r = indexedDB.open('jp_audio', 1); r.onupgradeneeded = () => r.result.createObjectStore('f'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); }
  });
}
async function idbDo(mode, fn) {
  const db = await idb();
  return new Promise((res, rej) => { const tx = db.transaction('f', mode); const rq = fn(tx.objectStore('f')); tx.oncomplete = () => res(rq && rq.result); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error); });
}
const idbPut = (k, v) => idbDo('readwrite', (st) => st.put(v, k));
const idbGet = (k) => idbDo('readonly', (st) => st.get(k));
const idbDel = (k) => idbDo('readwrite', (st) => st.delete(k));

function audioStop() {
  try { player.pause(); } catch (e) { /* ignore */ }
  if (apBlobUrl) { try { URL.revokeObjectURL(apBlobUrl); } catch (e) { /* ignore */ } apBlobUrl = null; }
  try { player.removeAttribute('src'); player.load(); } catch (e) { /* ignore */ }
  ap = null;
}
function apTick() {
  if (!ap) return; const sk = $('#apSeek'); if (!sk) return;
  const d = player.duration;
  if (isFinite(d) && d > 0) sk.value = Math.round(player.currentTime / d * 1000);
  $('#apCur').textContent = fmtT(player.currentTime); $('#apDur').textContent = fmtT(d);
}
function apIcon() {
  if (!ap) return;
  const b = $('#apPlay'); if (b) b.innerHTML = player.paused ? IC.play : IC.pause;
  $$('.aep').forEach((row) => { const i = +row.dataset.idx; const on = i === ap.idx; row.classList.toggle('cur', on); const pb = $('.play', row); if (pb) pb.innerHTML = on && !player.paused ? IC.pause : IC.play; });
  const t = $('#apTitle'); if (t) t.textContent = ap.idx >= 0 ? ap.eps[ap.idx].title : 'একটি পর্ব বেছে নিন';
  const pv = $('#apPrev'); if (pv) pv.disabled = ap.idx <= 0;
  const nx = $('#apNext'); if (nx) nx.disabled = ap.idx < 0 || ap.idx >= ap.eps.length - 1;
}
async function playEp(i) {
  if (!ap || i < 0 || i >= ap.eps.length) return;
  if (i === ap.idx && player.getAttribute('src')) { if (player.paused) player.play().catch(() => {}); else player.pause(); return; }
  const ep = ap.eps[i]; let src = ep.url;
  if ((getAdl()[ap.id] || {})[ep.n]) {
    try { const blob = await idbGet(ap.id + ':' + ep.n); if (blob) { if (apBlobUrl) URL.revokeObjectURL(apBlobUrl); apBlobUrl = URL.createObjectURL(blob); src = apBlobUrl; } } catch (e) { /* অনলাইন লিংক ব্যবহার হবে */ }
  }
  if (!src || (src === ep.url && navigator.onLine === false)) { toast('অফলাইনে শুধু ডাউনলোড করা পর্ব শোনা যায়'); return; }
  ap.idx = i; player.src = src; $('#apSeek') && ($('#apSeek').value = 0); apIcon();
  try { await player.play(); } catch (e) { toast('অডিও চালু করা যায়নি'); }
  apIcon();
}
function epRow(ep, i) {
  const have = !!((getAdl()[ap.id] || {})[ep.n]);
  return '<div class="aep" data-idx="' + i + '"><button class="play" data-act="aplay" data-idx="' + i + '" aria-label="চালান">' + IC.play + '</button>' +
    '<div class="txt"><div class="at">' + esc(ep.title) + '</div><div class="as">' + (have ? 'ডাউনলোড করা, অফলাইনে শোনা যাবে' : 'অনলাইনে শোনা যাবে') + '</div></div>' +
    (have ? '<button class="adl done" data-act="adel" data-n="' + ep.n + '" aria-label="ডাউনলোড মুছুন">' + IC.check + 'মুছুন</button>'
      : '<button class="adl" data-act="adl" data-n="' + ep.n + '" aria-label="ডাউনলোড">' + IC.download + 'ডাউনলোড</button>') + '</div>';
}
function renderEps() { const box = $('#apList'); if (!box || !ap) return; box.innerHTML = ap.eps.map(epRow).join(''); apIcon(); }
async function apDownload(n, btn) {
  const ep = ap.eps.find((e) => e.n === n); if (!ep) return;
  if (!ep.url) { toast('অফলাইনে নতুন পর্ব ডাউনলোড করা যায় না'); return; }
  btn.disabled = true; btn.textContent = 'নামছে…';
  try {
    const res = await fetch(ep.url); if (!res.ok) throw new Error('fail');
    const blob = await res.blob(); await idbPut(ap.id + ':' + n, blob);
    const dl = getAdl(); (dl[ap.id] = dl[ap.id] || {})[n] = blob.size || 1; store.set('jp_adl', dl);
    toast('"' + ep.title + '" ডাউনলোড হয়েছে');
  } catch (e) { toast('ডাউনলোড করা যায়নি। ইন্টারনেট ও স্টোরেজ দেখুন'); }
  if (ap) renderEps();
}
async function apRemove(n) {
  try { await idbDel(ap.id + ':' + n); } catch (e) { /* ignore */ }
  const dl = getAdl(); if (dl[ap.id]) { delete dl[ap.id][n]; if (!Object.keys(dl[ap.id]).length) delete dl[ap.id]; store.set('jp_adl', dl); }
  toast('ডাউনলোড মুছে ফেলা হয়েছে'); renderEps();
}
function apNext(auto) { if (ap && ap.idx < ap.eps.length - 1) playEp(ap.idx + 1); else if (auto) apIcon(); }
player.addEventListener('timeupdate', apTick);
player.addEventListener('loadedmetadata', apTick);
player.addEventListener('durationchange', apTick);
player.addEventListener('play', apIcon);
player.addEventListener('pause', apIcon);
player.addEventListener('ended', () => apNext(true));
player.addEventListener('error', () => { if (ap && player.getAttribute('src')) toast('অডিও চালানো যায়নি। অফলাইনে শুধু ডাউনলোড করা পর্ব চলে'); });

async function viewAudio() {
  let books;
  try { books = await api('/books?audio=1'); }
  catch (e) { // অফলাইন: শুধু যেসব বইয়ের পর্ব ডাউনলোড করা আছে
    const dl = getAdl(); const ac = getAcache(); books = Object.keys(dl).map((id) => ac[id]).filter(Boolean).map((c) => Object.assign({ chapterCount: 0, audioCount: Object.keys(dl[c.id]).length, status: '', cat: '', reads: 0, publishedAt: '' }, c));
    if (!books.length) throw e;
  }
  let h = headerTab() + '<main class="page">';
  if (!books.length) return h + '<div class="empty">এখনো কোনো অডিও উপন্যাস যোগ করা হয়নি।</div></main>';
  const newest = books.slice().sort((a, b) => (b.publishedAt || '').localeCompare(a.publishedAt || ''));
  const pop = books.slice().sort((a, b) => (b.reads || 0) - (a.reads || 0));
  h += '<div class="rail feat" id="audioFeat">' + books.filter((b) => b.featured).concat(books.filter((b) => !b.featured)).slice(0, 5).map(audioFeat).join('') + '</div>';
  h += secTitle('নতুন অডিওবুক', '/alist/new') + '<div class="rail g3">' + newest.slice(0, 10).map((b) => gcard(b, true)).join('') + '</div>';
  h += secTitle('জনপ্রিয় অডিওবুক', '/alist/pop') + '<div class="rail g3">' + pop.slice(0, 10).map((b) => gcard(b, true)).join('') + '</div>';
  return h + '</main>';
}
async function viewAudioBook(id) {
  let b; let offline = false;
  try { b = await api('/books/' + enc(id)); }
  catch (e) { const c = getAcache()[id]; if (!c) throw e; b = c; offline = true; }
  const dlmap = getAdl()[id] || {};

async function handleAcct(fm) {
  if (fm !== 'acct-save') return;
  const name = $('#acName').value.trim(); if (name.length < 2) return acErr('নাম কমপক্ষে ২ অক্ষরের হতে হবে');

}
function onSubmit(ev) {
  const f = ev.target.closest('form[data-form]'); if (!f) return;
  ev.preventDefault();
  if (/^acct-/.test(f.dataset.form)) { handleAcct(f.dataset.form); return; }

  }

let inputT = null;
function onInput(ev) {
  const id = ev.target.id;

  inputT = setTimeout(() => { curPath = '/search' + (v.trim() ? '?q=' + enc(v.trim()) : ''); setUrl(curPath, true); runSearch(v); }, 250);

async function onChange(ev) {
