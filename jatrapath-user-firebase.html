<!doctype html>
<html lang="bn" data-theme="sepia">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8e1b1b">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@400;700&family=Tiro+Bangla&display=swap">
<title>যাত্রাপথ বাংলা উপন্যাস</title>
<link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest">
<style>/* ===== যাত্রাপথ — স্টাইল =====
   রঙ: ক্রিম জমি, গাঢ় লাল অ্যাকশন, বাদামি লেখা। ডার্ক থিমে উষ্ণ কালো জমি, উজ্জ্বল লাল ও সোনালি আভা। */
:root{
  --bg:#faf3e3;--card:#ffffff;--card2:#fbf6ea;--text:#3b2a20;--muted:#7a6a5c;--line:#eadfc8;
  --accent:#8e1b1b;--accent2:#6f1414;--on-accent:#ffffff;--link:#8e1b1b;
  --chip:#f1e6cc;--pale:#f3d6cf;--gold:#c58a1f;
  --shadow:0 1px 4px rgba(60,40,20,.12);--shadow-up:0 -2px 14px rgba(60,30,20,.16);
  --fbg1:#2b1f1f;--fbg2:#5a3a36;
  --ok-bg:#dcebd6;--ok-fg:#2f6a2a;--done-bg:#e6dcc4;--done-fg:#6a4b12;
  --navh:78px;
}
html[data-theme=dark]{
  --bg:#14100e;--card:#211a17;--card2:#2a211d;--text:#f4ebdd;--muted:#b3a393;--line:#3a2e27;
  --accent:#c9403a;--accent2:#a32f2a;--on-accent:#ffffff;--link:#ff9a90;
  --chip:#33281f;--pale:#43231f;--gold:#e8b95a;
  --shadow:0 2px 8px rgba(0,0,0,.55);--shadow-up:0 -4px 18px rgba(0,0,0,.6);
  --fbg1:#0b0807;--fbg2:#43201c;
  --ok-bg:#223a28;--ok-fg:#a9d8a2;--done-bg:#443719;--done-fg:#e8cf8f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);overflow-x:hidden;max-width:100%}
body{font-family:'Noto Sans Bengali','Hind Siliguri','Kalpurush','SolaimanLipi',system-ui,sans-serif;line-height:1.5;font-size:15px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:disabled{cursor:default}
a{color:inherit;text-decoration:none}
img{max-width:100%}
svg{display:block}
h3{margin:14px 0 8px;font-size:17px}

/* ----- কাঠামো ----- */
.app{max-width:720px;margin:0 auto;min-height:100vh;padding-bottom:calc(var(--navh) + 18px + env(safe-area-inset-bottom))}
body.has-mini .app{padding-bottom:calc(var(--navh) + 96px + env(safe-area-inset-bottom))}
body.sub .app,body.reading .app{padding-bottom:24px}
body.sub .nav,body.sub .mini{display:none!important}
.page{padding:12px}
.loading{text-align:center;color:var(--muted);padding:40px 0}
.loading-skeleton{max-width:560px;margin:0 auto;padding:12px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;filter:blur(1.2px);opacity:.78}
.loading-skeleton .sk-card{height:148px;border-radius:14px;background:linear-gradient(110deg,var(--line,#e5d9c8) 25%,rgba(180,150,130,.2) 42%,var(--line,#e5d9c8) 62%);background-size:220% 100%;animation:sk-shimmer 1.25s ease-in-out infinite,sk-breathe 1.6s ease-in-out infinite}
@keyframes sk-shimmer{to{background-position-x:-220%}}@keyframes sk-breathe{0%,100%{transform:scale(.985);opacity:.58}50%{transform:scale(1.025);opacity:1}}
.books .item,.rail .wcard,.rail .gcard,.rail .feat-card{animation:book-pop .55s ease both;}
.books .item:nth-child(2),.rail .wcard:nth-child(2),.rail .gcard:nth-child(2){animation-delay:.07s}
.books .item:nth-child(3),.rail .wcard:nth-child(3),.rail .gcard:nth-child(3){animation-delay:.14s}
@keyframes book-pop{0%{transform:scale(.94);opacity:.45}55%{transform:scale(1.025);opacity:1}100%{transform:scale(1);opacity:1}}
@media(prefers-reduced-motion:reduce){.loading-skeleton .sk-card,.books .item,.rail .wcard,.rail .gcard,.rail .feat-card{animation:none}}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--muted)}
.errbox{margin:24px 16px;background:var(--card);border:1px solid var(--accent);border-radius:12px;padding:18px;text-align:center}
.errbox p{margin:0 0 12px}

/* ----- হেডার ----- */
.hdr{position:sticky;top:0;z-index:20;background:var(--bg);padding:8px 12px 6px}
.hdr-row{display:flex;align-items:center;justify-content:space-between;gap:4px;height:44px}
.hdr-title{display:flex;align-items:center;gap:6px;font-weight:700;font-size:17px;min-width:0}
.hdr-title.big{font-size:20px;justify-content:center;flex:1}
.hdr-title span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-row .sp{width:40px;height:40px;flex:0 0 auto}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;color:var(--text);flex:0 0 auto;position:relative}
.icon-btn:active{background:var(--chip)}
.icon-btn svg{width:22px;height:22px}
.bell em{position:absolute;top:2px;right:0;min-width:18px;height:18px;border-radius:9px;background:#d62828;color:#fff;font-style:normal;font-size:11px;line-height:18px;text-align:center;padding:0 4px}
.searchbar{display:flex;gap:8px;margin-top:6px}
.searchbar input{flex:1;min-width:0;height:42px;border-radius:21px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:0 16px;font:inherit;outline:none}
.searchbar input:focus{border-color:var(--accent)}
.searchbar button{height:42px;padding:0 16px;border-radius:21px;background:var(--accent);color:var(--on-accent);font-weight:600}

/* ----- সাধারণ উপাদান ----- */
.cover{aspect-ratio:2/3;border-radius:8px;overflow:hidden;background:var(--chip);flex:0 0 auto}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.t{font-weight:700;font-size:15px;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.a{color:var(--muted);font-size:13px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{font-size:12px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.badge{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;background:var(--chip);color:var(--text)}
.badge.run{background:var(--ok-bg);color:var(--ok-fg)}.badge.done{background:var(--done-bg);color:var(--done-fg)}.badge.demo{background:#e5e0f5;color:#40306b}
html[data-theme=dark] .badge.demo,html[data-theme=night] .badge.demo{background:#322a4a;color:#cfc3f2}
.ey{display:inline-grid;place-items:center}.ey svg{width:16px;height:16px}
.btn{background:var(--accent);color:var(--on-accent);border-radius:20px;padding:9px 20px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn.on{background:var(--chip);color:var(--text);border:1px solid var(--accent)}
.btn svg{width:18px;height:18px}
.btn[disabled]{opacity:.45}
.link-btn{color:var(--link);font-weight:600;font-size:14px;padding:4px 2px}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 14px;border-radius:16px;background:var(--chip);font-size:14px}
.chip.on{background:var(--accent);color:var(--on-accent)}
.toggle,.seg{display:flex;background:var(--chip);border-radius:16px;overflow:hidden}
.toggle button,.seg button{padding:5px 12px;font-size:13px}
.toggle button.on,.seg button.on{background:var(--accent);color:var(--on-accent)}
.pill{padding:5px 12px;border-radius:16px;font-size:13px;font-weight:600}
.pill.run{background:var(--ok-bg);color:var(--ok-fg)}.pill.done{background:var(--done-bg);color:var(--done-fg)}

/* ----- লিস্ট ও গ্রিড ----- */
.books.list{display:flex;flex-direction:column;gap:10px}
.books.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:560px){.books.grid{grid-template-columns:repeat(3,1fr)}}
.item{background:var(--card);border-radius:14px;box-shadow:var(--shadow);cursor:pointer;overflow:hidden}
.books.list .item{display:flex;gap:12px;padding:10px}
.books.list .cover{width:78px}
.books.grid .item{padding:8px;display:flex;flex-direction:column;gap:6px}
.books.grid .cover{width:100%}
/* লাইব্রেরির ডাউনলোড ট্যাব: ফোনে তিনটি বই পাশাপাশি, শুধু প্রচ্ছদ ও বইয়ের নাম */
.books.library-download-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:0 2px 18px}
.books.library-download-grid .library-download-book{padding:6px;min-width:0;gap:6px}
.books.library-download-grid .cover{width:100%;aspect-ratio:2/3;border-radius:10px}
.books.library-download-grid .info{width:100%;overflow:hidden}
.books.library-download-grid .info .t{font-size:13px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.books.library-download-grid .info .a{font-size:11px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}

.item .info{min-width:0;flex:1}

/* ----- ক্যাটাগরি ----- */
.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.cat{position:relative;height:96px;border-radius:14px;color:#fff;padding:12px;display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer;overflow:hidden;text-align:left}
.cat b{font-size:17px;text-shadow:0 1px 3px rgba(0,0,0,.4)}.cat small{opacity:.9}

/* ----- বইয়ের বিস্তারিত ----- */
.detail{display:flex;gap:14px;margin:6px 0 12px}
.detail .cover{width:128px}
.detail h1{margin:0;font-size:20px;line-height:1.3}
.stats{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:6px}
.stats span{display:inline-flex;align-items:center;gap:5px}
.actions{display:flex;gap:10px;flex-wrap:nowrap;margin:10px 0;width:100%}.actions>.btn{flex:1 1 0;min-width:0;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 8px;white-space:normal;text-align:center;line-height:1.25}.actions>.btn span[data-i]{flex:0 0 auto}@media(max-width:360px){.actions{gap:6px}.actions>.btn{font-size:13px;padding:9px 5px}}
.react{display:flex;gap:8px;margin:6px 0}
.desc{background:var(--card);border-radius:12px;padding:12px;margin:10px 0;line-height:1.7}
.ch{display:flex;align-items:stretch;background:var(--accent);color:var(--on-accent);border-radius:10px;margin-bottom:8px;overflow:hidden}
.ch .nm{flex:1;text-align:left;padding:13px 14px;font-weight:600;color:var(--on-accent)}
.ch .dl{width:52px;display:grid;place-items:center;background:rgba(0,0,0,.2);color:var(--on-accent)}
.ch .dl svg{width:22px;height:22px}.ch .dl.done{background:rgba(255,255,255,.28)}

/* ----- রিডার ----- */
.rbar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:2px;padding:4px 6px}
.rbar .mid{flex:1;min-width:0;text-align:center;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reader{padding:16px 18px 10px}
.reader h2{margin:0 0 4px;font-size:21px;color:var(--link)}
.reader .bk{color:var(--muted);font-size:13px;margin-bottom:14px}
.reader .txt p{margin:0 0 1.1em;line-height:var(--lh,1.95);font-size:var(--fs,19px);font-family:'Noto Serif Bengali','Hind Siliguri','Kalpurush',serif}
.rnav{display:flex;gap:10px;justify-content:space-between;padding:6px 18px 24px}
.rnav .btn{flex:1}.rnav .btn[disabled]{opacity:.4;pointer-events:none}

/* ----- নিচের বার ও চালিয়ে পড়ুন বার ----- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--card);border-radius:24px 24px 0 0;box-shadow:var(--shadow-up);padding:8px 8px calc(8px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
html[data-theme=dark] .nav,html[data-theme=night] .nav{border-top:1px solid var(--line)}
.nav [data-nav]{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text);font-size:13px;padding:2px 0}
.nav .ico{width:62px;height:32px;border-radius:16px;display:grid;place-items:center}
.nav .ico svg{width:23px;height:23px}
.nav [data-nav].on .ico{background:var(--pale);color:var(--link)}
.nav [data-nav].on{font-weight:700}
.mini{position:fixed;left:12px;right:12px;bottom:calc(var(--navh) + 10px + env(safe-area-inset-bottom));z-index:29;max-width:696px;margin:0 auto;background:var(--card);border-radius:18px;box-shadow:var(--shadow);border:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:8px 10px;overflow:hidden}
.mini[hidden]{display:none}
.mini-bar{position:absolute;left:0;bottom:0;height:3px;background:var(--accent)}
.mini-cover{width:46px;flex:0 0 auto;aspect-ratio:2/3;border-radius:6px;overflow:hidden;cursor:pointer;background:var(--chip)}
.mini-cover img{width:100%;height:100%;object-fit:cover;display:block}
.mini-txt{flex:1;min-width:0;cursor:pointer}
.mini-txt .mt{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-txt .ms{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-play{width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:0 0 auto}
.mini-play svg{width:22px;height:22px}
.mini-x{width:36px;height:36px;border-radius:50%;background:var(--chip);display:grid;place-items:center;flex:0 0 auto}
.mini-x svg{width:18px;height:18px}

/* ----- হোম ----- */
.page.home{padding-top:6px}
.rail{display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;padding-bottom:6px;scrollbar-width:none;overscroll-behavior-x:contain}
.rail::-webkit-scrollbar{display:none}
.rail.feat{margin-bottom:6px}
.fcard{position:relative;flex:0 0 88%;scroll-snap-align:start;display:flex;gap:14px;align-items:center;padding:18px;border-radius:24px;color:#fff;background:linear-gradient(135deg,var(--fbg1),var(--fbg2));cursor:pointer;min-height:176px}
html[data-theme=dark] .fcard,html[data-theme=night] .fcard{border:1px solid #4a2a26}
.fcard .cover{width:92px;border:3px solid #fff;border-radius:8px;box-shadow:0 3px 10px rgba(0,0,0,.45)}
.fcard .finfo{min-width:0;flex:1}
.fcard .ft{font-size:20px;font-weight:700;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.fcard .fa{font-size:17px;margin-top:2px;opacity:.95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fcard .fm{display:flex;align-items:center;gap:6px;font-size:13px;margin-top:6px;opacity:.9;flex-wrap:wrap}
.rank{position:absolute;top:12px;right:14px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);padding:1px 14px;border-radius:14px;font-weight:700;font-size:14px}
.frow{display:flex;gap:10px;margin-top:12px}
.fread{display:inline-flex;align-items:center;gap:8px;padding:9px 26px;border-radius:24px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);color:#fff;font-weight:600}
.fsave{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.4);display:grid;place-items:center;color:#fff}
.fsave.on{background:#fff;color:var(--accent)}
.welcome{margin:12px 2px 14px;font-size:13.5px;color:var(--muted)}
.welcome b{color:var(--text)}
.sec{margin-bottom:18px}
.sec-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sec-head h3{margin:0;display:flex;align-items:center;gap:10px;font-size:19px}
.bar{width:4px;height:22px;border-radius:2px;background:var(--accent);display:inline-block}
.allbtn{background:var(--chip);border-radius:18px;padding:7px 18px;font-weight:600;font-size:14px}
.rail.w{gap:12px}
.wcard{flex:0 0 92%;scroll-snap-align:start;display:flex;gap:12px;padding:10px;border-radius:20px;background:var(--card);border:1px solid var(--line);cursor:pointer}
.wcard .cover{width:84px;align-self:flex-start}
.winfo{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.wt{font-weight:700;font-size:16px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.wl{font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:6px;align-items:center}
.wrow{display:flex;gap:6px;align-items:center;margin-top:auto;padding-top:6px;flex-wrap:wrap}
.wread{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:16px;background:var(--pale);color:var(--link);font-weight:600;font-size:14px}
.rail.g{gap:12px}
.gcard{flex:0 0 138px;scroll-snap-align:start;background:var(--card);border-radius:14px;padding:8px;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;gap:5px}
.gcard .cover{width:100%}
.gcard .meta{margin-top:0}

/* ----- অডিও ----- */
.aep{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 10px;margin-bottom:8px}
.aep.cur{border-color:var(--accent);background:var(--card2)}
.aep .play{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:0 0 auto}
.aep .play svg{width:18px;height:18px}
.aep .txt{flex:1;min-width:0;text-align:left;color:inherit;font:inherit}
.aep .at{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aep .as{font-size:12px;color:var(--muted)}
.aep .adl{flex:0 0 auto;min-width:40px;height:40px;border-radius:20px;display:grid;place-items:center;background:var(--chip);padding:0 10px;font-size:12px;gap:4px;grid-auto-flow:column}
.aep .adl svg{width:20px;height:20px}
.aep .adl.done{background:var(--ok-bg);color:var(--ok-fg)}

/* ----- নোটিশ, অ্যাপ সম্পর্কে, যোগাযোগ ----- */
.notice{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.notice.new{border-color:var(--accent)}
.notice h4{margin:0 0 2px;font-size:16px}
.notice time{font-size:12px;color:var(--muted)}
.notice p{margin:8px 0 0;white-space:pre-wrap;line-height:1.7}
.info-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;line-height:1.75}
.about-logo{width:96px;height:96px;border-radius:22px;background:#000;object-fit:cover;display:block;margin:6px auto 10px}
.center{text-align:center}
.wa-num{font-size:24px;font-weight:700;letter-spacing:.5px;font-variant-numeric:tabular-nums;margin:6px 0 12px}
.btn.wa{background:#1fa855;color:#fff}

/* ----- মেনু ----- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.open{opacity:1;pointer-events:auto}
.menu{position:fixed;top:0;bottom:0;left:0;width:min(84vw,330px);background:var(--bg);z-index:50;transform:translateX(-102%);transition:transform .22s;padding:12px;overflow-y:auto;visibility:hidden}
.menu.open{transform:none;visibility:visible}
html[data-theme=dark] .menu,html[data-theme=night] .menu{border-right:1px solid var(--line)}
.menu-head{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px;margin-bottom:10px}
.menu-head img{width:30px;height:30px;border-radius:7px;background:#000;object-fit:cover}
.menu-head .icon-btn{margin-left:auto}
.menu-row{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:14px}
.menu-sep{height:1px;background:var(--line);margin:10px 4px}
.menu-link{display:flex;align-items:center;gap:10px;padding:12px;border-radius:10px;background:var(--card);margin-bottom:8px;width:100%;text-align:left}
.menu-link svg{width:20px;height:20px;color:var(--link)}

/* ----- বের হওয়ার সতর্কবার্তা ----- */
.dlg-wrap{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:20px}
.dlg-wrap[hidden]{display:none}
.dlg{width:min(100%,340px);background:var(--card);color:var(--text);border-radius:20px;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.5);border:1px solid var(--line)}
.dlg h4{margin:0 0 6px;font-size:18px}
.dlg p{margin:0 0 16px;color:var(--muted);line-height:1.6}
.dlg .row{display:flex;gap:10px}
.dlg .row .btn{flex:1}

/* ----- স্প্ল্যাশ ও টোস্ট ----- */
.splash{position:fixed;inset:0;z-index:100;background:#fbf4e4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;transition:opacity .3s}
.splash.hide{opacity:0;pointer-events:none}
.splash-wrap{position:relative;display:grid;place-items:center}
.splash-logo{width:150px;height:150px;border-radius:30px;background:#000;object-fit:cover;box-shadow:0 4px 14px rgba(0,0,0,.18);animation:sp-pop .7s cubic-bezier(.2,.9,.3,1.2) both}
.splash-ring{position:absolute;width:150px;height:150px;border-radius:34px;border:3px solid #8e1b1b;opacity:0;animation:sp-ring 1.6s .5s ease-out infinite;pointer-events:none}
.splash-name{font-size:20px;font-weight:700;color:#5a2a1a;margin-top:6px;animation:sp-up .6s .35s ease both}
.splash-tag{font-size:13px;color:#7a6a5c;animation:sp-up .6s .55s ease both}
.splash-dots{display:flex;gap:6px;margin-top:12px;animation:sp-up .5s .75s ease both}
.splash-dots i{width:7px;height:7px;border-radius:50%;background:#8e1b1b;opacity:.3;animation:dot 1s infinite}
.splash-dots i:nth-child(2){animation-delay:.2s}.splash-dots i:nth-child(3){animation-delay:.4s}
@keyframes dot{50%{opacity:1}}
@keyframes sp-pop{0%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:scale(1)}}
@keyframes sp-up{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:none}}
@keyframes sp-ring{0%{opacity:.5;transform:scale(1)}100%{opacity:0;transform:scale(1.45)}}
@media (prefers-reduced-motion:reduce){.splash-logo,.splash-name,.splash-tag,.splash-dots,.splash-ring,.splash-dots i{animation:none}}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#2b2118;color:#fff;padding:9px 18px;border-radius:20px;font-size:14px;z-index:130;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88vw;text-align:center}
html[data-theme=dark] .toast,html[data-theme=night] .toast{background:#f4ebdd;color:#1d1512}
.toast.show{opacity:1}

/* ----- নতুন থিম: সবুজ (হালকা) ও নীল রাত (গাঢ়) ----- */
html[data-theme=green]{
  --bg:#eef5ea;--card:#ffffff;--card2:#f3f9ef;--text:#1f3326;--muted:#5d7263;--line:#d3e3cc;
  --accent:#2e7d4f;--accent2:#1f5c38;--on-accent:#ffffff;--link:#2a7448;
  --chip:#dcebd3;--pale:#cfe6d2;--gold:#b8861f;
  --shadow:0 1px 4px rgba(20,50,30,.14);--shadow-up:0 -2px 14px rgba(20,50,30,.16);
  --fbg1:#14301f;--fbg2:#2f6b45;
  --ok-bg:#cfe8d0;--ok-fg:#1f6b2a;--done-bg:#e6dcc4;--done-fg:#6a4b12;
}
html[data-theme=night]{
  --bg:#0d1420;--card:#16202f;--card2:#1c2839;--text:#e8eef8;--muted:#9fb0c8;--line:#263549;
  --accent:#3f7fd9;--accent2:#2f64b0;--on-accent:#ffffff;--link:#8ab8ff;
  --chip:#1f2d42;--pale:#1d3556;--gold:#e8b95a;
  --shadow:0 2px 8px rgba(0,0,0,.55);--shadow-up:0 -4px 18px rgba(0,0,0,.6);
  --fbg1:#070b12;--fbg2:#1c3a66;
  --ok-bg:#1d3a2c;--ok-fg:#a9d8b8;--done-bg:#3a3320;--done-fg:#e8cf8f;
}

/* ----- অডিও প্লেয়ার পেজ ----- */
.apv{display:flex;flex-direction:column;align-items:center;text-align:center;padding:2px 4px 24px}
.wake{display:inline-flex;align-items:center;justify-content:center;gap:8px;align-self:stretch;padding:10px 16px;border-radius:22px;background:var(--chip);color:var(--text);border:1px solid var(--line);font-weight:600;font-size:14px;margin-bottom:18px}
.wake svg{width:19px;height:19px}
.wake.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.apv-cover{width:min(62vw,250px);aspect-ratio:2/3;border-radius:14px;overflow:hidden;background:var(--chip);box-shadow:0 10px 28px rgba(0,0,0,.32)}
.apv-cover img{width:100%;height:100%;object-fit:cover;display:block}
.apv-name{font-size:21px;font-weight:700;line-height:1.3;margin-top:18px}
.apv-ch{margin-top:6px;color:var(--link);font-weight:600;font-size:16px}
.apv-no{font-size:13px;color:var(--muted);margin-top:2px}
.apv-author{color:var(--muted);font-size:14px;margin-top:4px}
.apv-seek{display:flex;align-items:center;gap:10px;width:100%;margin-top:20px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.apv-seek input{flex:1;min-width:0;accent-color:var(--accent);height:28px}
.apv-ctl{display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:8px;gap:2px}
.apv-ctl button{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:var(--text);flex:0 0 auto}
.apv-ctl button svg{width:25px;height:25px}
.apv-ctl button:active{background:var(--chip)}
.apv-ctl button[disabled]{opacity:.3}
.apv-ctl button.on{color:var(--link);background:var(--pale)}
.apv-ctl .big{width:70px;height:70px;background:var(--accent);color:var(--on-accent);box-shadow:var(--shadow)}
.apv-ctl .big:active{background:var(--accent2)}
.apv-ctl .big svg{width:33px;height:33px}
.aep .txt{display:block;background:none;border:0}
.aep .at,.aep .as{display:block}

/* ----- অ্যাকাউন্ট ----- */
.acc-card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--accent);color:var(--on-accent);border-radius:16px;padding:12px;margin-bottom:10px}
.acc-card .av{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;overflow:hidden;flex:0 0 auto}
.acc-card .av img{width:100%;height:100%;object-fit:cover;display:block}
.acc-card .av svg{width:26px;height:26px}
.acc-card b{display:block;font-size:16px}.acc-card small{opacity:.92;font-size:12.5px}
.acc-strip{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--accent);border-radius:16px;padding:10px 14px;margin:2px 0 12px}
.acc-strip .ai{width:38px;height:38px;border-radius:50%;background:var(--pale);color:var(--link);display:grid;place-items:center;flex:0 0 auto}
.acc-strip .ai svg{width:22px;height:22px}
.acc-strip b{display:block;font-size:15px}.acc-strip small{color:var(--muted);font-size:12.5px}
.form{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.form label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.form input[type=text],.form input[type=tel],.form input[type=password]{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:0 14px;font:inherit;outline:none}
.form input:focus{border-color:var(--accent)}
.form .err{color:#d62828;font-size:13px;min-height:18px}
.avatar-pick{display:flex;flex-direction:column;align-items:center;gap:8px}
.avatar-pick .av{width:96px;height:96px;border-radius:50%;background:var(--chip);display:grid;place-items:center;overflow:hidden;border:2px dashed var(--accent);color:var(--link);cursor:pointer;margin:0}
.avatar-pick .av.big{border-style:solid;width:104px;height:104px}
.avatar-pick .av img{width:100%;height:100%;object-fit:cover;display:block}
.avatar-pick .av svg{width:34px;height:34px}
.hint{font-size:12.5px;color:var(--muted);line-height:1.65;margin:8px 0}
label.btn{cursor:pointer}

/* ----- মেনুর থিম বাছাই ----- */
.menu-box{background:var(--card);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:14px}
.themes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.themes button{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:12px;background:var(--chip);border:2px solid transparent;font-size:13.5px;text-align:left}
.themes button.on{border-color:var(--accent);font-weight:700}
.themes i{width:20px;height:20px;border-radius:50%;border:1px solid rgba(0,0,0,.25);flex:0 0 auto}

/* ----- নতুন প্লেয়ার ও লাল অধ্যায় ----- */
.apt{display:flex;align-items:center;gap:8px;padding:4px 2px 10px}
.apt b{flex:1;text-align:center;font-size:18px}
.apt .x,.apt-b{height:42px;min-width:42px;padding:0 14px;border-radius:21px;background:var(--chip);display:grid;place-items:center;font-weight:600;font-size:15px}
.apt .x{width:42px;padding:0}.apt svg{width:21px;height:21px}
.apt-b.on{background:var(--accent);color:var(--on-accent)}
.apv-cover{background:var(--chip);border:1px solid var(--line)}
.apv-dots{display:flex;gap:6px;margin-top:16px}.apv-dots i{width:6px;height:6px;background:var(--accent);display:block}
.apv-name{font-size:24px;margin-top:14px}
.apv-author{color:var(--text);font-weight:600;font-size:15px}
.btn.eps{width:100%;border-radius:16px;padding:15px;margin-top:28px;font-size:16px}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);display:flex;align-items:flex-end}.sheet[hidden]{display:none}
.sheet-in{background:var(--bg);width:100%;max-width:720px;margin:0 auto;border-radius:22px 22px 0 0;max-height:78vh;overflow:auto;padding:14px}
.sheet-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}.sheet-h b{flex:1;font-size:17px}
.aep{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.aep.cur{background:var(--accent2);box-shadow:0 0 0 2px var(--gold)}
.aep .as{color:rgba(255,255,255,.82)}.aep .play{background:rgba(0,0,0,.22)}
.aep .adl{background:rgba(255,255,255,.22);color:#fff}.aep .adl.done{background:rgba(255,255,255,.34);color:#fff}
button.aep{width:100%;text-align:left;padding:14px;font-weight:600}

/* ===== রিডার: ছবির মতো সেটিংস, অধ্যায় ড্রয়ার, ফন্ট, শুনুন বাটন (অডিও প্লেয়ারের স্টাইল অপরিবর্তিত) ===== */
:root{--chred:#8e1b1b}
html[data-theme=dark]{--chred:#c9403a}
html[data-theme=green],html[data-theme=night]{--chred:#b3261e}
.ch{background:var(--chred)}
.fread{background:#6d4fc7;border:0;color:#fff;padding:10px 30px;font-size:16px}
.fread .ey{display:none}

.reader .txt p{font-family:var(--rff,'Noto Serif Bengali','Hind Siliguri','Kalpurush',serif);margin:0 0 calc(var(--psv,8)*.1375em)}
body.reading .app{padding-bottom:calc(92px + env(safe-area-inset-bottom))}
html.rcb body.reading,html.rcb body.reading .app,html.rcb body.reading .rbar,html.rcb body.reading .rbot{background:var(--rbg);color:var(--rfg)}
html.rcb body.reading .rbar .icon-btn,html.rcb body.reading .rbar .mid,html.rcb body.reading .rbot button{color:var(--rfg)}
html.rcb body.reading .reader h2{color:var(--rfg)}
html.rcb body.reading .reader .bk{color:var(--rfg);opacity:.65}
html.rcb body.reading .rbar,html.rcb body.reading .rbot{border-color:rgba(128,128,128,.3)}
html.rcb:has(body.reading){background:var(--rbg)}
.rbar .icon-btn.on{background:var(--accent);color:var(--on-accent)}

.rbot{position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:720px;margin:0 auto;background:var(--bg);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
.rprog{height:3px;border-radius:2px;background:rgba(128,128,128,.35);overflow:hidden}
.rprog i{display:block;height:100%;width:0;background:var(--accent)}
.rpct{text-align:center;font-size:12px;color:var(--muted);margin:5px 0 4px}
.rbtns{display:flex;justify-content:space-around}
.rbtns button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;padding:4px 26px;color:var(--text)}
.rbtns svg{width:24px;height:24px}

.rset{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end}
.rset[hidden],.rdw[hidden]{display:none}
.rset-bd,.rdw-bd{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.rset-in{position:relative;width:100%;max-width:720px;margin:0 auto;background:var(--bg);color:var(--text);border-radius:22px 22px 0 0;max-height:82vh;overflow:auto;padding:8px 14px calc(18px + env(safe-area-inset-bottom))}
.rset-grip{width:44px;height:4px;border-radius:2px;background:var(--muted);opacity:.7;margin:4px auto 12px}
.rset-title{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:700;margin:6px 2px 14px}
.rset-title i{width:4px;height:24px;background:var(--accent);border-radius:2px}
.rtabs{display:flex;background:var(--card);border-radius:14px;padding:6px 4px;margin-bottom:12px}
.rtabs button{flex:1;padding:8px 4px;font-size:14.5px;position:relative;color:var(--muted)}
.rtabs button.on{color:var(--text);font-weight:700}
.rtabs button.on::after,.rsub button.on::after{content:"";position:absolute;left:24%;right:24%;bottom:0;height:3px;border-radius:2px;background:var(--accent)}
.rcard{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px}
.rrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rl{font-size:16px;margin-bottom:10px}.rrow .rl{margin:0}
.rstep{display:flex;align-items:center;gap:10px}
.rstep button{min-width:46px;height:44px;border-radius:14px;background:var(--chip);font-weight:700;font-size:16px}
.rstep b{min-width:28px;text-align:center;font-size:18px}
.sw{display:flex;gap:12px;overflow-x:auto;padding:4px 4px 6px;scrollbar-width:none}
.sw::-webkit-scrollbar{display:none}
.sw button{flex:0 0 auto;width:46px;height:46px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.sw button.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.sw button svg{width:20px;height:20px}
.fchips{display:flex;gap:8px;flex-wrap:wrap}
.fchips button{padding:11px 16px;border-radius:14px;background:var(--chip);font-size:16px;border:2px solid transparent}
.fchips button.on{border-color:var(--accent);font-weight:700}
.tgl{width:54px;height:30px;border-radius:15px;background:var(--chip);position:relative;flex:0 0 auto;border:1px solid var(--line);transition:background .2s}
.tgl::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:left .2s,background .2s}
.tgl.on{background:var(--pale);border-color:var(--accent)}
.tgl.on::after{left:27px;background:var(--accent)}
.rsel{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:0 12px;font:inherit}
.rrange{width:100%;accent-color:var(--accent)}
.rnotetxt{width:100%;min-height:84px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:10px;font:inherit;resize:vertical;margin-bottom:8px}
.rsub{display:flex;margin:2px 0 12px}
.rsub button{flex:1;padding:9px 6px;color:var(--muted);position:relative;font-size:15px}
.rsub button.on{color:var(--text);font-weight:700}
.rnote{background:var(--card);border-radius:12px;padding:10px 12px;margin-top:8px;display:flex;gap:8px;align-items:flex-start}
.rnote p{margin:0;flex:1;line-height:1.7;white-space:pre-wrap}
.rnote small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.rnote button{width:34px;height:34px;border-radius:50%;background:var(--chip);display:grid;place-items:center;flex:0 0 auto}
.rnote button svg{width:17px;height:17px}
.rempty{text-align:center;color:var(--muted);padding:34px 0}
.rhint{font-size:12.5px;color:var(--muted);line-height:1.6;margin:8px 2px 0}

.rdw{position:fixed;inset:0;z-index:70}
.rdw-in{position:absolute;top:0;bottom:0;left:0;width:min(82vw,340px);background:var(--bg);color:var(--text);overflow:auto;box-shadow:4px 0 24px rgba(0,0,0,.4)}
.rdw-h{background:var(--chred);color:#fff;font-size:20px;font-weight:700;padding:calc(18px + env(safe-area-inset-top)) 16px 16px;position:sticky;top:0;z-index:1}
.rdw-i{display:block;width:100%;text-align:left;padding:16px;border-bottom:1px solid var(--line);font-size:16px;color:var(--text)}
.rdw-i.cur{background:var(--chred);color:#fff;font-weight:700}
.rdw-e{padding:30px 16px;text-align:center;color:var(--muted)}

/* আপডেট: ছোট কার্ড, মসৃণ কিন্তু সংযত অ্যানিমেশন, টকব্যাক/কীবোর্ড ফোকাস */
.wcard{flex-basis:calc(50% - 5px);gap:8px;padding:8px;border-radius:14px;min-width:0}
.wcard .cover{width:72px!important;height:108px!important}
.wcard .wt{font-size:14px;line-height:1.3}
.wcard .wl{font-size:11px;line-height:1.35}
.wcard .winfo{min-width:0;overflow:hidden}
.wcard .wrow{gap:5px;flex-wrap:wrap}
.gcard{flex-basis:118px;padding:7px;border-radius:12px}
.fcard{border-radius:16px}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid #22c98b;outline-offset:3px}
button,.btn,.wcard,.gcard,.fcard{transition:transform .18s ease,box-shadow .18s ease,background-color .18s ease}
button:active,.btn:active{transform:scale(.98)}
.welcome{animation:jpWelcome .65s ease both}
.splash{animation:jpSplashIn .45s ease-out both}
@keyframes jpWelcome{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes jpSplashIn{from{opacity:0}to{opacity:1}}
@media(max-width:380px){.wcard{flex-basis:100%}.wcard .cover{width:64px!important;height:96px!important}.gcard{flex-basis:108px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}


/* ===== Reference-matched home update v5 ===== */
.home{padding-left:16px;padding-right:16px}
.sec{margin-bottom:22px}
.sec-head{margin-bottom:9px;gap:8px}
.sec-head h3{font-size:19px;gap:9px;line-height:1.25}
.allbtn{padding:7px 14px;font-size:13px;white-space:nowrap}
.rail.w,.rail.g{gap:10px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;padding:0 0 5px;}
.rail.w .wcard{flex:0 0 62%;min-width:0;box-sizing:border-box;gap:9px;padding:8px;border-radius:19px;scroll-snap-align:start;min-height:132px;}
.rail.w .wcard .cover{flex:0 0 34%;width:34%!important;max-width:90px;align-self:stretch;aspect-ratio:2/3;height:auto!important;overflow:hidden;border-radius:12px;}
.rail.w .wcard .cover img{width:100%;height:100%;object-fit:cover;display:block}
.rail.w .winfo{flex:1;min-width:0;gap:3px;overflow:hidden}
.rail.w .wt{font-size:14px;line-height:1.28;-webkit-line-clamp:2}
.rail.w .wl{font-size:11.5px;line-height:1.3;gap:4px}
.rail.w .wrow{padding-top:4px;gap:5px;flex-wrap:wrap}
.rail.w .wread{font-size:12px;padding:4px 8px;gap:4px}
.rail.w .pill{font-size:11px;padding:3px 7px}
.rail.g .gcard{flex:0 0 40%;min-width:0;padding:7px;border-radius:14px}
.rail.g .gcard .cover{width:100%;aspect-ratio:2/3;overflow:hidden}
.rail.g .gcard .cover img{width:100%;height:100%;object-fit:cover}
.fcard{flex:0 0 82%;padding:14px;border-radius:24px;gap:12px}
.fcard .cover{width:84px}
.wcard:focus-visible,.gcard:focus-visible,.fcard:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.dlg-wrap{background:rgba(15,12,10,.38);backdrop-filter:blur(2px);padding:16px}
.dlg{width:min(100%,420px);border-radius:28px;padding:28px 24px 24px;background:#f8f2e7;color:#17120f;border:1px solid #eadfce;box-shadow:0 16px 48px rgba(35,20,12,.25);text-align:center}
.dlg h4{font-size:25px;font-weight:800;margin:0 0 12px;color:#17120f}
.dlg h4:before{content:'⚠';display:grid;place-items:center;margin:0 auto 20px;width:84px;height:84px;border-radius:50%;background:#f4e9e2;color:#7d2006;font-size:40px}
.dlg p{font-size:17px;line-height:1.65;color:#211a16;margin:0 0 24px}
.dlg .row{gap:12px}
.dlg .row .btn{min-height:52px;border-radius:15px;font-size:18px;font-weight:700}
#dlgNo{background:transparent;border:1.5px solid #7d2a12;color:#241710}
#dlgYes{background:#812506;color:white;border:1.5px solid #812506}
#dlgNo:focus-visible,#dlgYes:focus-visible{outline:3px solid #237b56;outline-offset:3px}
@media(max-width:380px){.home{padding-left:12px;padding-right:12px}.rail.w .wcard{flex-basis:68%;padding:7px;gap:7px}.rail.w .wcard .cover{flex-basis:32%;width:32%!important}.rail.w .wt{font-size:13px}.rail.w .wl{font-size:10.5px}.sec-head h3{font-size:18px}.allbtn{padding:6px 10px;font-size:12px}.dlg{padding:24px 18px 20px}.dlg h4{font-size:23px}.dlg p{font-size:16px}}
@media(prefers-reduced-motion:reduce){.rail.w,.rail.g{scroll-behavior:auto}}



/* লাইব্রেরি ডাউনলোড ভিউ: গ্রিড (৩টি) অথবা তালিকা */
.library-view-switch{display:flex;justify-content:flex-end;gap:8px;padding:0 2px 12px;flex-wrap:wrap}
.library-view-switch button{border:1px solid var(--line,#e5d9c8);border-radius:999px;background:var(--card,#fffaf1);padding:9px 14px;font:inherit;font-size:13px;color:var(--text,#33251d);cursor:pointer;min-height:40px}
.library-view-switch button.on{background:var(--accent,#7b1717);color:#fff}
.books.library-download-list{display:flex;flex-direction:column;gap:10px;padding:0 2px 18px}
.books.library-download-list .library-download-book{display:flex;align-items:center;gap:12px;padding:10px;min-width:0;border:1px solid var(--line,#e5d9c8);border-radius:20px;background:var(--card,#fffaf1)}
.library-download-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;padding-right:10px;position:relative;z-index:2}
.library-download-actions .btn{min-height:38px;padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:5px;cursor:pointer}
.library-download-actions .btn svg{width:16px;height:16px}
.library-download-actions .btn.danger{background:#a52a2a;color:#fff;border:1px solid #a52a2a;border-radius:10px;margin-right:4px}
.books.library-download-grid .library-download-actions{display:grid;grid-template-columns:1fr;gap:6px}
.books.library-download-grid .library-download-actions .btn{width:100%;padding:6px 5px;font-size:11px;min-height:34px}
.library-download-book .library-download-actions button{pointer-events:auto}
.books.library-download-list .cover{width:82px;min-width:82px;height:118px;aspect-ratio:auto;object-fit:cover;border-radius:12px}
.books.library-download-list .info{min-width:0;flex:1;overflow:hidden}
.books.library-download-list .info .t{font-size:16px;line-height:1.35;overflow-wrap:anywhere}
.books.library-download-list .info .a{font-size:13px;line-height:1.4;overflow-wrap:anywhere}

/* Fix: downloaded chapter buttons must wrap cleanly and never overlap text */
.achs{display:flex;flex-wrap:wrap;align-items:flex-start;gap:8px;margin-top:10px;max-width:100%;}
.achs>span{display:inline-flex;align-items:stretch;max-width:100%;min-width:0;flex:0 1 auto;}
.achs>span button{min-width:0;max-width:100%;white-space:normal;overflow-wrap:anywhere;line-height:1.45;}
.achs>span button[data-act="read"]{text-align:left;padding:8px 10px;}
.achs>span button[data-act="rm-dl"]{flex:0 0 auto;align-self:stretch;min-width:38px;}
@media(max-width:420px){.achs>span{max-width:100%;}.achs>span button[data-act="read"]{font-size:14px;padding:7px 8px;}}

html[data-theme=light]{--bg:#f7f7f5;--card:#fff;--card2:#f1f1ee;--text:#222;--muted:#6b6b66;--line:#e4e4de}
html[data-theme=sepia]{--bg:#f3e9dc;--card:#fbf5ea;--card2:#f6ecdc;--text:#2f2018;--muted:#7a6656;--line:#e6d6bf;--accent:#7a1c06;--accent2:#5e1404;--link:#7a1c06;--chip:#ecdcc3;--pale:#efd5c8;--fbg1:#2b1810;--fbg2:#6a2a14}
html[data-theme=rose]{--bg:#fff1f6;--card:#fff;--card2:#ffe8f0;--text:#3a1626;--muted:#8a5a6c;--line:#f6d3e1;--accent:#d6246e;--accent2:#a8185a;--link:#c21a62;--chip:#fbdbe8;--pale:#fcd3e2;--fbg1:#3a0f24;--fbg2:#a8185a}
html[data-theme=lavender]{--bg:#f4f0fb;--card:#fff;--card2:#ede7f8;--text:#2a1f45;--muted:#6f6590;--line:#ddd3f0;--accent:#7c3aed;--accent2:#5b21b6;--link:#6d28d9;--chip:#e4daf7;--pale:#ddd2f6;--fbg1:#1f1240;--fbg2:#5b21b6}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gcard.poster{position:relative;padding:0!important;overflow:hidden;background:#222;border-radius:14px;flex:0 0 38%}
.pgrid .gcard.poster{flex:none}
.gcard.poster .cover{width:100%;aspect-ratio:2/3;border-radius:0;overflow:hidden}
.gcard.poster .cover img{width:100%;height:100%;object-fit:cover}
.gcard.poster .vb{position:absolute;top:7px;left:7px;background:rgba(0,0,0,.6);color:#fff;border-radius:12px;padding:1px 8px;font-size:11px;display:flex;gap:4px;align-items:center}
.gcard.poster .ov{position:absolute;left:0;right:0;bottom:0;padding:30px 8px 8px;background:linear-gradient(transparent,rgba(0,0,0,.88));color:#fff}
.gcard.poster .ov .t{font-weight:700;font-size:13px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:#fff}
.gcard.poster .ov .a{font-size:11px;opacity:.92;color:#fff;display:flex;align-items:center;gap:4px}
.vt{font-style:normal;background:#1d9bf0;color:#fff;border-radius:50%;width:13px;height:13px;font-size:9px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.newtag{background:var(--pale);color:var(--accent);border-radius:10px;padding:2px 8px;font-size:11px;font-weight:700}

.hsave{color:var(--text)}.hsave.on{color:var(--accent)}.hsave.on svg{fill:currentColor}
.detail{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.bk-t{font-weight:800;font-size:16px;line-height:1.3}
.achip{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border-radius:20px;padding:3px 10px 3px 4px;margin:6px 0;font-size:13px}
.achip .av{width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-style:normal;font-size:12px}
.bk-l{font-size:13px;color:var(--muted);margin:2px 0}
.stats3{display:flex;gap:18px;margin-top:8px}.stats3 span{display:flex;flex-direction:column;font-size:11px;color:var(--muted)}.stats3 b{font-size:15px;color:var(--text)}
.toc{display:flex;align-items:center;justify-content:space-between;margin:12px 0 8px}.toc h3{margin:0}.toc .react{margin:0;display:flex;gap:8px}
.rb{display:inline-flex;align-items:center;gap:4px;height:36px;padding:0 12px;border-radius:18px;background:var(--chip);color:var(--text)}.rb.on{background:var(--accent);color:var(--on-accent)}
.ptag{margin-left:8px;font-size:10.5px;font-weight:600;background:var(--pale);color:var(--accent);border-radius:8px;padding:1px 7px;white-space:nowrap}
html body .ch{background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:14px}
html body .ch .nm{color:var(--text);font-weight:600}
html body .ch .dl{background:transparent;color:var(--accent)}
html body .ch .dl.done{background:transparent;color:var(--ok-fg)}
.actions .btn.ghost{background:var(--chip);color:var(--text)}
</style>

      if (!res.ok) throw new Error(data.error || 'সার্ভার থেকে উত্তর পাওয়া যায়নি');
      return data;
    } catch (e) {
      if (!(e instanceof TypeError)) throw e;
      if (!window.LocalAPI) throw new Error('সার্ভার পাওয়া যায়নি');
      useLocal = true;
    }
  }
  return window.LocalAPI.handle(opts.method || 'GET', path, opts.body || null, user);
}

/* ---------- রাউটার ---------- */
let curPath = (location.hash || '#/').slice(1) || '/';
const navStack = [];
const scrollMem = {};
let keepScrollOnce = false; let restoreOnce = false; let leaving = false;
function setUrl(p, replace) { try { history[replace ? 'replaceState' : 'pushState']({ jp: 1 }, '', '#' + p); } catch (e) { /* স্যান্ডবক্সে URL বদলানো নাও যেতে পারে */ } }
function nav(path, replace) {
  path = String(path || '/').replace(/^#/, ''); if (path.charAt(0) !== '/') path = '/' + path;
  if (path === curPath) { route(); return; }
  scrollMem[curPath] = window.scrollY;
  if (!replace) navStack.push(curPath);
  curPath = path; setUrl(path, replace); route();
}
function goBack() {
  if (navStack.length) { restoreOnce = true; curPath = navStack.pop(); setUrl(curPath, true); route(); } else nav('/', true);
}
function onPop(ev) {
  if (ev && ev.state && ev.state.g) { // সবচেয়ে প্রথম ইতিহাস-ঘরে ফিরলে বের হওয়ার সতর্কবার্তা
    if (!leaving) { askExit(); try { history.pushState({ jp: 1 }, '', '#' + curPath); } catch (e) { /* ignore */ } }
    return;
  }
  const p = (location.hash || '#/').slice(1) || '/';
  if (p === curPath) return;
  restoreOnce = true;
  if (navStack.length && navStack[navStack.length - 1] === p) navStack.pop();
  curPath = p; route();
}
function parseHash() {
  const raw = curPath;
  const qi = raw.indexOf('?');
  const pathPart = qi >= 0 ? raw.slice(0, qi) : raw;
  const params = new URLSearchParams(qi >= 0 ? raw.slice(qi + 1) : '');
  const seg = pathPart.split('/').filter(Boolean).map((s) => { try { return decodeURIComponent(s); } catch (e) { return s; } });
  return { seg, params };
}
function clearAuto() { if (timerAuto) { clearInterval(timerAuto); timerAuto = null; } }

function setNavActive(key) { $$('#nav [data-nav]').forEach((a) => a.classList.toggle('on', a.dataset.nav === key)); }

const appEl = () => $('#app');
function setView(html) { appEl().innerHTML = html; fillIcons(appEl()); }
function loadingView() {
  const skeleton = '<div class="loading-skeleton" aria-hidden="true">' + '<div class="sk-card"></div>'.repeat(6) + '</div>';
  setView(navigator.onLine ? '<div class="loading"><div>বই লোড হচ্ছে…</div>' + skeleton + '</div>' : '<div class="loading">অফলাইন অবস্থায় সংরক্ষিত তথ্য লোড হচ্ছে…</div>');
}
function errorView(msg) {
  setView('<div class="errbox"><p>⚠️ ' + esc(msg || 'কিছু একটা ভুল হয়েছে') + '</p><button class="btn" data-act="retry">আবার চেষ্টা করুন</button> <button class="btn ghost" data-act="go" data-href="/">হোমে যান</button></div>');
}

async function route(keepMenu) {
  const token = ++renderToken;
  const { seg, params } = parseHash();
  const page = seg[0] || 'home';
  const inPlayer = page === 'audio' && !!seg[2]; // প্লেয়ার পেজে থাকলে অডিও চলতে থাকে
  rdReset(); clearAuto(); if (!inPlayer) { audioStop(); wakeOff(); } if (keepMenu !== true) closeMenu();
  document.body.classList.toggle('reading', page === 'read');
  const isTab = page === 'home' || page === 'lib' || page === 'new' || ((page === 'cat' || page === 'audio') && !seg[1]);
  document.body.classList.toggle('sub', !isTab);
  if (!isTab) { $('#mini').hidden = true; document.body.classList.remove('has-mini'); }
  setNavActive({ home: 'home', new: 'new', cat: 'cat', lib: 'lib' }[page] || '');
  try {
    let html;
    if (page === 'home') { loadingView(); html = await viewHome(); }
    else if (page === 'list') { loadingView(); html = await viewList(seg[1], params.get('status') || 'সব'); }
    else if (page === 'cat') { loadingView(); html = seg[1] ? await viewCategory(seg[1]) : await viewCategories(); }
    else if (page === 'search') { html = viewSearchShell(params.get('q') || ''); }
    else if (page === 'book') { loadingView(); html = await viewBook(seg[1]); }
    else if (page === 'read') { loadingView(); html = await viewReader(seg[1], parseInt(seg[2], 10), params.get('listen') === '1'); }
    else if (page === 'lib') { loadingView(); html = await viewLibrary(params.get('tab') || 'dl'); }
    else if (page === 'audio') { loadingView(); html = seg[2] ? await viewAudioPlayer(seg[1], parseInt(seg[2], 10)) : seg[1] ? await viewAudioBook(seg[1]) : await viewAudio(); }
    else if (page === 'new') { loadingView(); html = await viewNewEp(); }
    else if (page === 'account') { loadingView(); html = viewAccount(); }
    else if (page === 'notices') { loadingView(); html = await viewNotices(); }
    else if (page === 'about') { loadingView(); html = await viewAbout(); }
    else if (page === 'contact') { loadingView(); html = await viewContact(); }
    else { html = '<div class="errbox"><p>এই পেজ পাওয়া যায়নি।</p><button class="btn" data-act="go" data-href="/">হোমে যান</button></div>'; }
    if (token !== renderToken) return; // নতুন নেভিগেশন হয়ে গেছে
    setView(html);
    if (keepScrollOnce) keepScrollOnce = false;
    else if (restoreOnce) { restoreOnce = false; window.scrollTo(0, scrollMem[curPath] || 0); }
    else window.scrollTo(0, 0);
    renderMini(page);
    afterRender(page, seg, params);
  } catch (e) {
    if (token !== renderToken) return;
    console.warn(e);
    errorView(e.message);
  }
}

function afterRender(page, seg, params) {
  if (page === 'read') rdAfter(seg);
  if (page === 'home' || (page === 'audio' && !seg[1])) { startAuto($('#featuredRail')); updateBell(); }
  if (page === 'search') {
    const inp = $('#qInput'); if (inp) { inp.focus(); const v = inp.value; inp.setSelectionRange(v.length, v.length); }
    runSearch(params.get('q') || '');
  }
  if (page === 'audio' && seg[2] && ap) {
    apIcon(); wakeUI();
    if (store.get('jp_wake', false) && !wake) wakeOn().then(wakeUI);
    if (ap.want !== ap.idx) playEp(ap.want);
  }
}

/* একটিমাত্র টাইমার; শুধু রেল এলিমেন্ট স্ক্রল হয় */
function startAuto(rail) {
  clearAuto();
  if (!rail || rail.children.length < 2) return;
  timerAuto = setInterval(() => {
    if (!document.body.contains(rail) || document.hidden) return;
    if (Date.now() < pauseAutoUntil) return;
    const first = rail.children[0]; const gap = 10;
    const step = first.offsetWidth + gap;
    const max = rail.scrollWidth - rail.clientWidth;
    if (rail.scrollLeft >= max - 4) rail.scrollTo({ left: 0, behavior: 'smooth' });
    else rail.scrollTo({ left: Math.min(max, Math.round(rail.scrollLeft / step) * step + step), behavior: 'smooth' });
  }, 2800);
}

let searchSeq = 0;
async function runSearch(q) {
  const my = ++searchSeq; const box = $('#searchRes'); const info = $('#searchInfo');
  if (!box) return;
  q = q.trim();
  if (!q) { box.innerHTML = '<div class="empty">বইয়ের নাম, লেখকের নাম বা ক্যাটাগরি লিখে খুঁজুন।</div>'; info.textContent = ''; return; }
  try {

/* ---------- অডিও ---------- */
// অডিও ট্যাবে শুধু অডিও বই। বই খুললে অধ্যায়ের তালিকা, অধ্যায়ে ক্লিক করলে প্লেয়ার খোলে। ডাউনলোড হয় অধ্যায় ধরে ধরে।
const player = new Audio(); player.preload = 'none';
let ap = null; let apBlobUrl = null;
const getAdl = () => store.get('jp_adl', {});
const getAcache = () => store.get('jp_acache', {});
const fmtT = (x) => { if (!isFinite(x) || x < 0) x = 0; const m = Math.floor(x / 60); const r = Math.floor(x % 60); return bn(m) + ':' + bn(r < 10 ? '0' + r : r); };
function idb() {
  return new Promise((res, rej) => {
    try { const r = indexedDB.open('jp_audio', 1); r.onupgradeneeded = () => r.result.createObjectStore('f'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); }
  });
}
async function idbDo(mode, fn) {
  const db = await idb();
  return new Promise((res, rej) => { const tx = db.transaction('f', mode); const rq = fn(tx.objectStore('f')); tx.oncomplete = () => res(rq && rq.result); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error); });
}
const idbPut = (k, v) => idbDo('readwrite', (st) => st.put(v, k));
const idbGet = (k) => idbDo('readonly', (st) => st.get(k));
const idbDel = (k) => idbDo('readwrite', (st) => st.delete(k));

function audioStop() {
  try { player.pause(); } catch (e) { /* ignore */ }
  if (apBlobUrl) { try { URL.revokeObjectURL(apBlobUrl); } catch (e) { /* ignore */ } apBlobUrl = null; }
  try { player.removeAttribute('src'); player.load(); } catch (e) { /* ignore */ }
  ap = null;
}
const apCur = () => (ap ? (ap.idx >= 0 ? ap.idx : (ap.want || 0)) : 0);
function apTick() {
  if (!ap) return; const sk = $('#apSeek'); if (!sk) return;
  const d = player.duration;
  if (isFinite(d) && d > 0) sk.value = Math.round(player.currentTime / d * 1000);
  $('#apCur').textContent = fmtT(player.currentTime); $('#apDur').textContent = fmtT(d);
}
function apIcon() {
  if (!ap) return;
  const b = $('#apPlay'); if (b) b.innerHTML = player.paused ? IC.play : IC.pause;
  const c = apCur(); const ep = ap.eps[c];
  const t = $('#apTitle'); if (t && ep) t.textContent = ep.title;
  const no = $('#apNo'); if (no) no.textContent = 'অধ্যায় ' + bn(c + 1) + ' / ' + bn(ap.eps.length);
  const nx = $('#apNext'); if (nx) nx.disabled = !ap.shuffle && c >= ap.eps.length - 1;
  const sh = $('#apShuf'); if (sh) sh.classList.toggle('on', !!ap.shuffle);
}
function mediaMeta(ep) {
  if (!('mediaSession' in navigator) || typeof MediaMetadata === 'undefined') return;
  try { navigator.mediaSession.metadata = new MediaMetadata({ title: ep.title, artist: ap.author || '', album: ap.title }); } catch (e) { /* ignore */ }
}
async function playEp(i, toggle, fromHist) {
  if (!ap || i < 0 || i >= ap.eps.length) return;
  if (toggle && i === ap.idx && player.getAttribute('src')) { if (player.paused) player.play().catch(() => {}); else player.pause(); return; }
  const ep = ap.eps[i]; let src = ep.url;
  if ((getAdl()[ap.id] || {})[ep.n]) {
    try { const blob = await idbGet(ap.id + ':' + ep.n); if (blob) { if (apBlobUrl) URL.revokeObjectURL(apBlobUrl); apBlobUrl = URL.createObjectURL(blob); src = apBlobUrl; } } catch (e) { /* অনলাইন লিংক ব্যবহার হবে */ }
  }
  if (!src || (src === ep.url && navigator.onLine === false)) { toast('অফলাইনে শুধু ডাউনলোড করা অধ্যায় শোনা যায়'); return; }
  if (!ap) return;
  if (ap.idx >= 0 && ap.idx !== i && !fromHist) ap.hist.push(ap.idx);
  ap.idx = i; ap.played.add(i);
  player.src = src; applySpeed(); const sk = $('#apSeek'); if (sk) sk.value = 0;
  apIcon(); mediaMeta(ep);
  if (parseHash().seg[2]) { curPath = '/audio/' + enc(ap.id) + '/' + ep.n; setUrl(curPath, true); }
  try { await player.play(); } catch (e) { if (!e || e.name !== 'NotAllowedError') toast('অডিও চালু করা যায়নি'); }
  apIcon();
}
function seekBy(s) {
  if (!ap || !player.getAttribute('src')) return;
  const d = player.duration; let t = player.currentTime + s;
  if (isFinite(d) && d > 0) t = Math.min(d - 0.1, t);
  player.currentTime = Math.max(0, t);
}
function pickNext(auto) {
  if (!ap) return -1; const n = ap.eps.length; const c = apCur();
  if (ap.shuffle && n > 1) {
    let pool = []; for (let i = 0; i < n; i++) if (!ap.played.has(i) && i !== c) pool.push(i);
    if (!pool.length) { if (auto) return -1; for (let i = 0; i < n; i++) if (i !== c) pool.push(i); }
    return pool[Math.floor(Math.random() * pool.length)];
  }
  return c + 1 < n ? c + 1 : -1;
}
function apNext(auto) { const j = pickNext(auto); if (j >= 0) playEp(j); else if (auto) apIcon(); }
function apPrev() {
  if (!ap) return;
  if (ap.idx < 0 || player.currentTime > 3) { if (ap.idx >= 0) player.currentTime = 0; return; }
  if (ap.shuffle) { if (ap.hist.length) playEp(ap.hist.pop(), false, true); else player.currentTime = 0; return; }
  if (ap.idx > 0) playEp(ap.idx - 1); else player.currentTime = 0;
}

/* ---------- স্ক্রিন অন রাখুন ---------- */
let wake = null;
async function wakeOn() {
  if (!('wakeLock' in navigator)) return false;
  try {
    const l = await navigator.wakeLock.request('screen'); wake = l;
    l.addEventListener('release', () => { if (wake === l) wake = null; wakeUI(); });
    return true;
  } catch (e) { return false; }
}
async function wakeOff() { const l = wake; wake = null; try { if (l) await l.release(); } catch (e) { /* ignore */ } }
function wakeUI() {
  const b = $('#apWake'); if (!b) return; b.classList.toggle('on', !!wake);
}
async function toggleWake() {
  if (wake) { await wakeOff(); store.set('jp_wake', false); wakeUI(); toast('স্ক্রিন অন রাখা বন্ধ হয়েছে'); return; }
  const ok = await wakeOn(); wakeUI();
  if (ok) { store.set('jp_wake', true); toast('এখন স্ক্রিন অন থাকবে'); } else toast('এই ব্রাউজারে স্ক্রিন অন রাখা সম্ভব হয়নি');
}
function initMedia() {
  if (!('mediaSession' in navigator)) return;
  const set = (a, f) => { try { navigator.mediaSession.setActionHandler(a, f); } catch (e) { /* ignore */ } };
  set('play', () => { if (ap) player.play().catch(() => {}); });
  set('pause', () => player.pause());
  set('previoustrack', () => apPrev());
  set('nexttrack', () => apNext(false));
  set('seekbackward', () => seekBy(-10));
  set('seekforward', () => seekBy(10));
}

/* ---------- অধ্যায়ের সারি ও ডাউনলোড ---------- */
function epRow(ep, i) {

    '<button class="txt" data-act="aopen" data-n="' + ep.n + '"><span class="at">' + esc(ep.title) + '</span><span class="as">' + (have ? 'ডাউনলোড করা, অফলাইনে শোনা যাবে' : 'অনলাইনে শোনা যাবে') + '</span></button>' +
    (have ? '<button class="adl done" data-act="adel" data-n="' + ep.n + '" aria-label="ডাউনলোড মুছুন">' + IC.check + 'মুছুন</button>'
      : '<button class="adl" data-act="adl" data-n="' + ep.n + '" aria-label="ডাউনলোড">' + IC.download + 'ডাউনলোড</button>') + '</div>';
}
function renderEps() { const box = $('#apList'); if (!box || !ap) return; box.innerHTML = ap.eps.map(epRow).join(''); }
async function apDownload(n, btn) {
  const ep = ap.eps.find((e) => e.n === n); if (!ep) return;
  if (!ep.url) { toast('অফলাইনে নতুন অধ্যায় ডাউনলোড করা যায় না'); return; }
  btn.disabled = true; btn.textContent = 'নামছে…';
  try {
    const res = await fetch(ep.url); if (!res.ok) throw new Error('fail');
    const blob = await res.blob(); await idbPut(ap.id + ':' + n, blob);
    const dl = getAdl(); (dl[ap.id] = dl[ap.id] || {})[n] = blob.size || 1; store.set('jp_adl', dl);
    // Save a user-accessible audio file using the actual media type, not .txt.
    const mime = (blob.type || res.headers.get('content-type') || '').toLowerCase();
    const ext = mime.includes('mpeg') || mime.includes('mp3') ? 'mp3'
      : mime.includes('ogg') ? 'ogg' : mime.includes('wav') ? 'wav'
      : mime.includes('mp4') || mime.includes('m4a') || mime.includes('aac') ? 'm4a'

function doLogout() {
  syncNow();
  ['jp_saved', 'jp_dl', 'jp_last', 'jp_lastbook', 'jp_prog', 'jp_readday', 'jp_cache', 'jp_time', 'jp_minihide'].forEach((k) => store.del(k));
  store.del(SES_KEY); secs = 0; renderMenuAcc(); refreshTime(); toast('লগ আউট হয়েছে'); nav('/', true);
}
async function onChange(ev) {
  if (ev.target.id !== 'accPhoto') return;
  const file = ev.target.files && ev.target.files[0]; if (!file) return;
  const data = await readPhoto(file); if (!data) { toast('ছবিটি পড়া যায়নি'); return; }
  const a = curAcc();
  if (a) { a.photo = data; accPut(a); renderMenuAcc(); nav('/account', true); toast('ছবি বদলানো হয়েছে'); }
  else { pendingPhoto = data; const p = $('#accPrev'); if (p) p.innerHTML = '<img src="' + data + '" alt="">'; }
}

/* ---------- সতর্কবার্তা ও বের হওয়া ---------- */
let dlgYes = null; let exitOpen = false;
function showDialog(o) {
  $('#dlgT').textContent = o.title; $('#dlgP').textContent = o.text; $('#dlgNo').textContent = o.no; $('#dlgYes').textContent = o.yes;
  dlgYes = o.onYes; $('#dlg').hidden = false; $('#dlgNo').focus();
}
function hideDialog() { $('#dlg').hidden = true; dlgYes = null; exitOpen = false; }
function askExit() {
  if (exitOpen) return; exitOpen = true;
  showDialog({ title: 'নিশ্চিত করুন', text: 'আপনি কি যাত্রাপথ থেকে বের হতে চান? নতুন পর্বগুলো আপনার অপেক্ষায় আছে, আরেকটু পড়ে যান।', no: 'না', yes: 'হ্যাঁ', onYes: doExit });
}
function doExit() {
  leaving = true;
  try { history.go(-2); } catch (e) { /* ignore */ }
  setTimeout(() => { try { window.close(); } catch (e) { /* ignore */ } leaving = false; if (!document.hidden) toast('অ্যাপ বন্ধ করতে ফোনের হোম বাটন চাপুন'); }, 600);
}
function initExitGuard() { try { history.replaceState({ g: 1 }, '', location.href); history.pushState({ jp: 1 }, '', location.href); } catch (e) { /* ইতিহাস বদলানো নাও যেতে পারে */ } }

/* ---------- মেনু ---------- */
function openMenu() { $('#menu').classList.add('open'); $('#menuOverlay').classList.add('open'); renderMenuAcc(); refreshTime(); applyTheme(); applyLayoutBtns(); }
function closeMenu() { $('#menu').classList.remove('open'); $('#menuOverlay').classList.remove('open'); }

/* ---------- ক্লিক হ্যান্ডলার (একবারই যুক্ত) ---------- */
async function onClick(ev) {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act; const d = el.dataset;
  try {
    switch (act) {
      case 'menu-open': openMenu(); break;
      case 'menu-close': closeMenu(); break;
      case 'theme': store.set('jp_theme', d.v); applyTheme(); break;
      case 'layout': store.set('jp_layout', d.v); applyLayoutBtns(); keepScrollOnce = true; route(true); break;
      case 'go': closeMenu(); nav(d.href, !!d.replace); break;
      case 'back': goBack(); break;
      case 'bell': nav('/notices'); break;
      case 'retry': route(); break;
      case 'read-book': {
        const b = await api('/books/' + enc(d.id)); if (!b.chapters.length) { toast('এই বইয়ে এখনো কোনো অধ্যায় নেই'); break; }
        const last = (store.get('jp_last', {}))[b.id]; const n = last && b.chapters.some((c) => c.n === last) ? last : b.chapters[0].n;
        nav('/read/' + enc(b.id) + '/' + n); break;
      }
      case 'save-q': {
        const ids = getSaved(); const i = ids.indexOf(d.id);
        if (i >= 0) ids.splice(i, 1); else ids.push(d.id);
        store.set('jp_saved', ids); el.classList.toggle('on', i < 0); toast(i >= 0 ? 'লাইব্রেরি থেকে সরানো হয়েছে' : 'লাইব্রেরিতে রাখা হয়েছে'); break;
      }
      case 'aopen': nav('/audio/' + enc(ap ? ap.id : d.id) + '/' + d.n); break;
      case 'aplay-cur': if (ap) { if (ap.idx < 0) playEp(ap.want || 0); else playEp(ap.idx, true); } break;
      case 'aprev': apPrev(); break;
      case 'anext': apNext(false); break;
      case 'arew': seekBy(-10); break;
      case 'afwd': seekBy(10); break;
      case 'ashuf': if (ap) { ap.shuffle = !ap.shuffle; store.set('jp_shuffle', ap.shuffle); apIcon(); toast(ap.shuffle ? 'শাফল চালু' : 'শাফল বন্ধ'); } break;
      case 'wake': await toggleWake(); break;
      case 'aspd': { const s = store.get('jp_spd', 1); store.set('jp_spd', SPEEDS[(SPEEDS.indexOf(s) + 1) % SPEEDS.length]); applySpeed(); el.textContent = spdTxt(); break; }
      case 'aeps': if (ap) { $('#apSheetList').innerHTML = sheetRows(); $('#apSheet').hidden = false; fillIcons($('#apSheet')); apIcon(); } break;
      case 'aeps-close': $('#apSheet').hidden = true; break;
      case 'apick': $('#apSheet').hidden = true; playEp(+d.i); break;
      case 'acc-logout': askLogout(); break;
      case 'adl': await apDownload(+d.n, el); break;
      case 'adel': await apRemove(+d.n); break;
      case 'copy': {
        let copied = false;
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(String(d.v));
            copied = true;
          }
        } catch (e) { /* WebView/HTTP fallback below */ }
        if (!copied) {
          try {
            const field = document.createElement('textarea');
            field.value = String(d.v); field.setAttribute('readonly', '');
            field.style.position = 'fixed'; field.style.opacity = '0'; field.style.left = '-9999px';
            document.body.appendChild(field); field.select(); field.setSelectionRange(0, field.value.length);
            copied = document.execCommand('copy'); field.remove();
          } catch (e) { copied = false; }
        }
        toast(copied ? 'নম্বর কপি হয়েছে' : 'নম্বর কপি করা যায়নি। নম্বরটি চেপে ধরে কপি করুন: ' + d.v);
        break;
      }
      case 'dlg-no': hideDialog(); break;
      case 'dlg-yes': { const f = dlgYes; hideDialog(); if (f) f(); break; }
      case 'mini-close': store.set('jp_minihide', d.key); renderMini('x'); break;
      case 'book': nav('/book/' + enc(d.id)); break;
      case 'abook': nav('/audio/' + enc(d.id)); break;
      case 'read': nav('/read/' + enc(d.id) + '/' + d.n); break;
      case 'to-book': { const top = navStack[navStack.length - 1] || ''; if (top === '/book/' + enc(d.id)) goBack(); else nav('/book/' + enc(d.id)); break; }
      case 'fs': { const fs = Math.max(14, Math.min(30, store.get('jp_fs', 19) + (+d.d) * 2)); store.set('jp_fs', fs); applyFont(); break; }
      case 'save': {
        const ids = getSaved(); const i = ids.indexOf(d.id);
        if (i >= 0) ids.splice(i, 1); else ids.push(d.id);
        store.set('jp_saved', ids); toast(i >= 0 ? 'লাইব্রেরি থেকে সরানো হয়েছে' : 'লাইব্রেরিতে রাখা হয়েছে');
        if (d.lib) { keepScrollOnce = true; route(); }
        else { el.className = 'btn ' + (i >= 0 ? 'ghost' : 'on'); el.innerHTML = '<span data-i="save" data-done="1">' + IC.save + '</span>' + (i >= 0 ? 'লাইব্রেরিতে রাখুন' : 'লাইব্রেরি থেকে সরান'); }
        break;
      }
      case 'react': {
        const cur = el.classList.contains('on') ? null : d.r;
        const r = await api('/books/' + enc(d.id) + '/react', { method: 'POST', body: { reaction: cur } });
        $('#likeN').textContent = bn(r.likes); $('#dislikeN').textContent = bn(r.dislikes);
        $('#likeBtn').classList.toggle('on', r.myReaction === 'like'); $('#dislikeBtn').classList.toggle('on', r.myReaction === 'dislike'); break;
      }
      case 'dl-ch': {
        ev.preventDefault(); ev.stopPropagation();
        const chapterNo = +d.n;
        if (getDl()[d.id] && getDl()[d.id][chapterNo]) {
          el.disabled = true; el.classList.add('done'); el.innerHTML = IC.check;
          el.setAttribute('aria-disabled', 'true');
          el.title = 'এই অধ্যায়টি ইতিমধ্যে ডাউনলোড করা হয়েছে';
          toast('এই অধ্যায়টি আগেই ডাউনলোড করা হয়েছে'); break;
        }
        el.disabled = true;
        try {
          await downloadChapter(d.id, chapterNo, true);
          if (!(getDl()[d.id] && getDl()[d.id][chapterNo])) throw new Error('ডাউনলোড সংরক্ষণ হয়নি। আবার চেষ্টা করুন।');
          el.classList.add('done'); el.innerHTML = IC.check;
          el.setAttribute('aria-disabled', 'true');
          el.title = 'এই অধ্যায়টি ইতিমধ্যে ডাউনলোড করা হয়েছে';
          toast('বইটি লাইব্রেরিতে ডাউনলোড করা হয়েছে');
        } finally {
          // সফল ডাউনলোড হলে বাটন স্থায়ীভাবে বন্ধ থাকবে; ব্যর্থ হলে আবার চেষ্টা করা যাবে।
          if (!(getDl()[d.id] && getDl()[d.id][chapterNo])) el.disabled = false;
        }
        break;
      }
      case 'dl-book': {
        ev.preventDefault(); ev.stopPropagation(); el.disabled = true;
        try {
          const b = await api('/books/' + enc(d.id)); cacheBook(b);
          for (const ch of b.chapters) {
            if (getDl()[b.id] && getDl()[b.id][ch.n]) continue;
            const c = await fetchChapter(b.id, ch.n); storeChapter(b.id, c);
          }
          toast('বইটি ডাউনলোড করা হয়েছে এবং লাইব্রেরিতে সংরক্ষিত হয়েছে');
          keepScrollOnce = true; route(true);
        } finally { el.disabled = false; }
        break;
      }
      case 'lib-view': {
        break;
      }
      case 'rm-dl': {
        const dl = getDl(); if (dl[d.id]) { delete dl[d.id][d.n]; if (!Object.keys(dl[d.id]).length) delete dl[d.id]; store.set('jp_dl', dl); toast('ডাউনলোড মুছে ফেলা হয়েছে'); route(); } break;
      }
      case 'rm-book-dl': {
        ev.preventDefault(); ev.stopPropagation();
        const dl = getDl();
        if (dl[d.id]) { delete dl[d.id]; store.set('jp_dl', dl); }
        toast('বইটির ডাউনলোড লাইব্রেরি থেকে মুছে ফেলা হয়েছে');
        keepScrollOnce = true; route(true); break;
      }
      default: break;
    }
  } catch (e) { console.error(e); el.disabled = false; toast(e.message || 'কাজটি করা যায়নি'); }
}

function onSubmit(ev) {
  const f = ev.target.closest('form[data-form]'); if (!f) return;
  ev.preventDefault();
  if (f.dataset.form === 'account') { submitAccount(f); return; }
  const inp = $('input', f); const q = (inp.value || '').trim();
  if (f.dataset.form === 'search') nav('/search' + (q ? '?q=' + enc(q) : ''));
  else { curPath = '/search' + (q ? '?q=' + enc(q) : ''); setUrl(curPath, true); runSearch(q); }
}
let inputT = null;
function onInput(ev) {
  if (ev.target.id === 'apSeek') { if (isFinite(player.duration) && player.duration > 0) player.currentTime = ev.target.value / 1000 * player.duration; return; }
  if (ev.target.id !== 'qInput') return;
  clearTimeout(inputT); const v = ev.target.value;
  inputT = setTimeout(() => { curPath = '/search' + (v.trim() ? '?q=' + enc(v.trim()) : ''); setUrl(curPath, true); runSearch(v); }, 250);
}

/* ---------- ত্রুটি ধরা ---------- */
window.addEventListener('error', (e) => { console.error(e.error || e.message); const t = $('#toast'); if (t) toast('একটি সমস্যা হয়েছে, আবার চেষ্টা করুন'); });
window.addEventListener('unhandledrejection', (e) => { console.error(e.reason); });

/* ---------- শুরু ---------- */
function boot() {
  applyTheme(); applyLayoutBtns(); applyFont(); fillIcons(document); renderMenuAcc(); initMedia();
  document.addEventListener('click', onClick);
  document.addEventListener('click', onRdClick);
  document.addEventListener('input', onRdInput); document.addEventListener('change', onRdInput);
  try { if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => { const w = $('#rset'); if (w && !w.hidden && rdTab === 'voice') rdRender(); }; } catch (e) { /* ignore */ }
  document.addEventListener('change', onChange);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && store.get('jp_wake', false) && !wake && ap && $('#apWake')) wakeOn().then(wakeUI); });
  document.addEventListener('submit', onSubmit);
  document.addEventListener('input', onInput);
  // ব্যবহারকারী রেলে স্পর্শ করলে অটো-স্ক্রল কিছুক্ষণ থামবে
  ['touchstart', 'pointerdown', 'wheel'].forEach((t) => document.addEventListener(t, (e) => { if (e.target.closest && e.target.closest('#featuredRail')) pauseAutoUntil = Date.now() + 6000; }, { passive: true, capture: true }));
  window.addEventListener('popstate', onPop); window.addEventListener('hashchange', onPop);
  window.addEventListener('scroll', onScrollProgress, { passive: true });
  startTimeTracker();
  initExitGuard();
  route();
  // স্প্ল্যাশ ~২ সেকেন্ড দেখায়; কোনো ত্রুটিতেও আটকে থাকবে না
  const wait = Math.max(300, 2200 - (Date.now() - (window.__t0 || Date.now())));
  setTimeout(() => { const s = $('#splash'); if (s) { s.classList.add('hide'); setTimeout(() => s.remove(), 400); } }, wait);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
