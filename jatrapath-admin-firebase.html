<!DOCTYPE html><html lang="bn" data-theme="dark"><head><meta charset="utf-8"><meta name="theme-color" content="#0c0d0f"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>যাত্রাপথ অ্যাডমিন</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0d0f;--bg2:#140e1b;--cd:#1a1223;--cd2:#221730;--tx:#f4ecf7;--mu:#a596b3;--pr:#ff8a7a;--ac:#d6322b;--ac2:#7a2cc4;--bd:#2e2140;--ok:#46d39a;--er:#ff6b7d;--wr:#f0b84a;--glow:#d6322b40;color-scheme:dark}
:root[data-theme=light]{--bg:#f6f0f4;--bg2:#fff;--cd:#ffffff;--cd2:#f3ebf1;--tx:#24122b;--mu:#7d6a88;--pr:#b3261e;--ac:#c4281f;--ac2:#6b2bb5;--bd:#e6d8e3;--ok:#14855a;--er:#c0283a;--wr:#9a6a00;--glow:#c4281f2e;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{font-size:var(--fs,16px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Hind Siliguri',sans-serif;line-height:1.5;background-image:radial-gradient(900px 420px at 85% -80px,#7a2cc433,transparent 70%),radial-gradient(700px 380px at -10% 0,#d6322b2b,transparent 70%);background-attachment:fixed}
:root[data-theme=light] body{background-image:radial-gradient(900px 420px at 85% -80px,#7a2cc41c,transparent 70%),radial-gradient(700px 380px at -10% 0,#d6322b18,transparent 70%)}
#app{max-width:760px;margin:auto;min-height:100vh}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--bd)}

main{padding:16px 14px calc(104px + env(safe-area-inset-bottom))}
.pg{animation:in .25s ease}@keyframes in{from{opacity:0;transform:translateY(10px)}}

svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.card{background:linear-gradient(160deg,var(--cd),var(--cd2));border:1px solid var(--bd);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:0 8px 24px #0003}

.row{display:flex;align-items:center;gap:12px}.fx{flex:1;min-width:0}.fx small{display:block;color:var(--mu)}
.ac{display:flex;gap:2px}

.btn{border:0;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font:inherit;font-weight:600;padding:11px 16px;border-radius:14px;cursor:pointer;transition:.15s;box-shadow:0 6px 16px var(--glow)}.btn:active{transform:scale(.97)}
.btn.s{background:color-mix(in srgb,var(--ac2) 18%,transparent);color:var(--tx);box-shadow:none;border:1px solid var(--bd)}.btn.d{background:linear-gradient(135deg,#e0334a,#a3122b);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btns .btn{flex:1}

.hero:before{content:'';position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:#ffffff1f}
.hero:after{content:'';position:absolute;right:30px;bottom:-60px;width:120px;height:120px;border-radius:50%;background:#ffffff14}

.hero .hs{display:flex;gap:10px;position:relative}.hero .hs div{flex:1;background:#0003;border-radius:14px;padding:8px 10px;backdrop-filter:blur(6px)}.hero .hs b{display:block;font-size:1.15rem;line-height:1.2}.hero .hs span{font-size:.72rem;opacity:.85}

.qa{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:8px}
h3{font-size:.85rem;margin:20px 2px 10px;color:var(--mu);font-weight:600;letter-spacing:.4px}
.fl{display:block;margin-bottom:12px;font-size:.85rem;color:var(--tx);font-weight:600}
input[type=text],input[type=number],input[type=url],input[type=email],input[type=password],select,textarea,input:not([type]){width:100%;margin-top:5px;font:inherit;color:var(--tx);background:var(--bg2);border:1.5px solid var(--bd);border-radius:14px;padding:11px 13px}
textarea{resize:vertical;line-height:1.8}input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac2);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac2) 25%,transparent)}
.g2{display:grid;grid-template-columns:90px 1fr;gap:10px}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}

.bar{height:7px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .2s}
.cnt{display:flex;justify-content:space-between;margin-top:6px;font-size:.9rem}
.mg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.mg .card{margin:0;text-align:center;cursor:pointer;padding:18px 8px}.mg .card:active{transform:scale(.97)}.mg small{display:block;color:var(--mu);font-size:.72rem}

.emp{text-align:center;color:var(--mu);padding:32px 12px}.emp svg{width:44px;height:44px;opacity:.5}
.ban{display:flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--ok) 12%,transparent);color:var(--ok);border:1px solid color-mix(in srgb,var(--ok) 35%,transparent);border-radius:14px;padding:8px 12px;font-weight:600;margin-bottom:12px;font-size:.88rem}
.ban:before{content:'';width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 25%,transparent);flex:none}
.note{font-size:.8rem;color:var(--mu);margin:0 2px 10px}
.strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}.strip div{text-align:center;font-size:.7rem;width:70px;flex:none}
.strip .cv{width:70px;height:98px;margin-bottom:4px}
#mod .ov{position:fixed;inset:0;background:#000a;backdrop-filter:blur(4px);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:in .15s}
#mod .ov.c{align-items:center;padding:22px}
#mod .sh{background:var(--cd);border:1px solid var(--bd);width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:20px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;color:var(--tx)}
#mod .ov.c .sh{max-width:360px;border-radius:26px;text-align:center;padding:24px 20px 20px;animation:pop .22s ease}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.dic{width:64px;height:64px;margin:0 auto 12px;border-radius:50%;display:grid;place-items:center;font-size:1.8rem;background:color-mix(in srgb,var(--er) 18%,transparent);box-shadow:0 0 0 8px color-mix(in srgb,var(--er) 9%,transparent)}
#mod h2{margin:0 0 8px;font-size:1.1rem}.rd{line-height:2;font-size:1.05rem}
#mod p{color:var(--mu);margin:0 0 4px}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:linear-gradient(135deg,#2a1b3a,#1a1223);border:1px solid var(--bd);color:#fff;padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:90%;text-align:center;box-shadow:0 10px 30px #000a}
#toast.on{opacity:1;transform:translate(-50%,0)}
.sk{height:78px;border-radius:20px;background:linear-gradient(90deg,var(--cd),var(--cd2),var(--cd));background-size:200%;animation:sh 1.1s infinite;margin-bottom:12px}@keyframes sh{to{background-position:-200%}}
audio{width:100%;margin-top:8px}
.fc{display:inline-flex;align-items:center;gap:6px}.fc svg{width:16px;height:16px}
.num{width:52px;height:52px;border-radius:50%;border:1.5px solid var(--bd);display:grid;place-items:center;font-weight:700;flex:none}
.ob{border:1.5px solid var(--bd);background:var(--bg2);color:var(--tx);font:inherit;font-weight:600;border-radius:99px;padding:8px 16px;cursor:pointer}.ob.x{background:color-mix(in srgb,var(--er) 16%,transparent);color:var(--er);border-color:color-mix(in srgb,var(--er) 40%,transparent)}
.vw{display:flex;gap:6px;align-items:center;color:var(--mu);font-size:.85rem;flex-wrap:wrap}.vw svg{width:16px;height:16px}
.sw{position:relative;width:52px;height:30px;flex:none}.sw input{opacity:0;position:absolute;inset:0;width:100%;height:100%;margin:0;z-index:1}.sw i{position:absolute;inset:0;background:var(--bd);border-radius:99px;transition:.2s}.sw i:after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}.sw input:checked+i{background:linear-gradient(135deg,var(--ac),var(--ac2))}.sw input:checked+i:after{left:25px}
.tb{position:relative;display:flex;flex-wrap:nowrap;overflow-x:auto;align-items:center;gap:2px;padding:8px;background:var(--bg2);border:1.5px solid var(--bd);border-radius:16px 16px 0 0}
.tb button{border:0;background:none;color:var(--mu);font:inherit;font-size:1rem;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px;min-width:40px;cursor:pointer;flex:none;border-radius:10px}.tb button:active{background:#8883}.tb button b,.tb button u,.tb button i{font-size:1.1rem;color:var(--tx)}.tb svg{width:20px;height:20px}
.ed{min-height:280px;max-height:60vh;overflow:auto;padding:14px;background:var(--bg2);color:var(--tx);border:1.5px solid var(--bd);border-top:0;border-radius:0 0 16px 16px;line-height:1.9;font-size:16px;outline:0}.ed:empty:before{content:attr(data-ph);color:var(--mu);font-style:italic}
.big{width:100%;border:0;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font:inherit;font-size:1.08rem;font-weight:700;padding:16px;border-radius:99px;box-shadow:0 10px 26px var(--glow);margin-top:12px;cursor:pointer}.big:active{transform:scale(.98)}.big:disabled{opacity:.4;cursor:not-allowed}
.dz{display:flex;flex-direction:column;align-items:center;gap:6px;border:2px dashed color-mix(in srgb,var(--ac2) 55%,var(--bd));border-radius:22px;padding:28px 12px;text-align:center;background:color-mix(in srgb,var(--ac2) 8%,transparent);cursor:pointer;margin-top:6px}.dz svg{width:52px;height:52px;color:var(--pr)}.dz small{color:var(--mu);font-weight:400}
.rad{display:flex;gap:6px;align-items:center;font-weight:600}input[type=radio],input[type=checkbox]{accent-color:var(--ac);width:20px;height:20px;margin:0}
.srch{display:flex;align-items:center;gap:8px;background:var(--cd);border:1.5px solid var(--bd);border-radius:99px;padding:4px 16px;color:var(--mu)}.srch input{border:0!important;margin:0!important;background:none!important;padding:9px 0!important;box-shadow:none!important}
.addb{width:100%;border:1.5px dashed color-mix(in srgb,var(--ac) 60%,var(--bd));background:color-mix(in srgb,var(--ac) 10%,transparent);color:var(--pr);font:inherit;font-weight:700;padding:12px;border-radius:99px;margin-top:10px;cursor:pointer}
.fcs{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:8px;margin-bottom:12px;padding-bottom:4px}.fcs .fc{flex:none;white-space:nowrap}
.fc{border:1.5px solid var(--bd);background:var(--cd);color:var(--tx);font:inherit;border-radius:99px;padding:6px 14px;font-size:.85rem}.fc.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-color:transparent;box-shadow:0 6px 14px var(--glow)}
.pill{background:color-mix(in srgb,var(--ac2) 22%,transparent);color:var(--tx);border-radius:99px;padding:3px 12px;font-size:.8rem;white-space:nowrap}
.tg{font-size:.72rem;padding:2px 10px;border-radius:99px;background:var(--bg2);border:1px solid var(--bd);color:var(--mu)}.tg.g{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok);border-color:transparent}
button.tg{font:inherit;font-size:.72rem;cursor:pointer;color:inherit}
.sts{display:inline-flex;gap:14px;align-items:center;border:1.5px solid var(--bd);border-radius:99px;padding:6px 14px;margin-top:8px}.sts span{display:flex;gap:4px;align-items:center}.sts svg{width:18px;height:18px}
.ba{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--bd)}.ba button{border:1.5px solid var(--bd);font:inherit;border-radius:99px;padding:8px;background:var(--bg2);color:var(--tx);cursor:pointer}.ba .p{background:color-mix(in srgb,var(--ac2) 22%,transparent);border-color:color-mix(in srgb,var(--ac2) 50%,transparent)}.ba .x{background:color-mix(in srgb,var(--er) 15%,transparent);color:var(--er);border-color:color-mix(in srgb,var(--er) 40%,transparent)}
.st2{display:flex!important;gap:12px;align-items:center;margin-top:6px}.st2 span{display:flex;gap:4px;align-items:center}.st2 svg{width:15px;height:15px}
.col{display:flex;flex-direction:column;gap:6px}.col .ob{padding:6px 14px}
.card{padding:13px}
.lg{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:20px;overflow:auto;background-image:radial-gradient(600px 400px at 90% 0,#7a2cc44d,transparent 70%),radial-gradient(500px 400px at 0 100%,#d6322b40,transparent 70%)}
.lgc{width:100%;max-width:380px;text-align:center}
.lgc .logo{width:72px;height:72px;border-radius:24px;margin:0 auto 14px}.lgc .logo svg{width:36px;height:36px}
.lgc h2{margin:0;font-size:1.4rem}.lgc p.sub{color:var(--mu);margin:2px 0 18px}
.lgc .card{text-align:left;padding:18px}
.pw{position:relative}.pw button{position:absolute;right:6px;bottom:6px;border:0;background:none;color:var(--mu);padding:8px;cursor:pointer}
.rem{display:flex;gap:8px;align-items:center;font-size:.85rem;color:var(--mu);margin:4px 0 8px}

/* ===== ইউজার অ্যাপ ট্যাব ===== */
#uaWrap{display:none;position:fixed;left:0;right:0;margin:auto;max-width:760px;padding:0 12px;z-index:4;flex-direction:column;gap:8px;animation:in .25s ease}
.uabar{display:flex;align-items:center;gap:4px;background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 22%,var(--cd)),color-mix(in srgb,var(--ac2) 22%,var(--cd)));border:1px solid var(--bd);border-radius:18px;padding:8px 8px 8px 14px}
.uabar b{font-size:.95rem}.uabar small{display:block;color:var(--mu);font-size:.72rem}
.uabar .ib{background:var(--cd);border:1px solid var(--bd);width:36px;height:36px;justify-content:center;align-items:center;padding:0}
.uafr{position:relative;flex:1;min-height:0;border-radius:24px;overflow:hidden;border:1.5px solid var(--bd);background:#000;box-shadow:0 16px 40px #0007}
.uafr iframe{width:100%;height:100%;border:0;display:block;background:var(--bg)}
#uaSet{display:none;position:absolute;inset:0;overflow:auto;padding:16px;background:var(--bg)}
nav button{position:relative}
.btn.uab{background:linear-gradient(135deg,#1fa67a,#2d6bd6)}
/* ===== বইয়ের কভার গ্রিড ===== */
.vt{display:flex;gap:8px;margin:0 0 14px;padding:4px;background:var(--cd);border:1px solid var(--bd);border-radius:99px}
.vt button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-weight:600;font-size:.85rem;padding:8px;border-radius:99px;cursor:pointer;transition:.2s}
.vt button.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;box-shadow:0 6px 14px var(--glow)}
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 10px}
.bgc{position:relative;aspect-ratio:2/3;border-radius:16px;overflow:hidden;box-shadow:0 10px 22px #0006;cursor:pointer;animation:in .4s ease both;transition:transform .18s;background:var(--cd)}
.bgc:active{transform:scale(.95)}
.bgc>img,.bgc .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bgc .ph{display:grid;place-items:center;color:#fff;font-weight:700;font-size:1.7rem}
.bgc:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,#0000 40%,#000e 100%);pointer-events:none}
.bgt{position:absolute;left:8px;right:8px;bottom:8px;z-index:1;color:#fff}
.bgt b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:.82rem;line-height:1.25}
.bgt small{display:block;color:#ffffffc0;font-size:.66rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.bgs{position:absolute;top:6px;left:6px;z-index:1}
.bgs .tg{background:#000a;color:#fff;border:0;backdrop-filter:blur(4px)}.bgs .tg.g{background:#14855acc}
.bgv{position:absolute;top:6px;right:6px;z-index:1;background:#000a;color:#fff;border-radius:99px;padding:1px 8px;font-size:.66rem;backdrop-filter:blur(4px)}
@media(min-width:560px){.bgrid{grid-template-columns:repeat(4,1fr)}}
/* সাম্প্রতিক বই স্ট্রিপ */
.rcs{gap:12px;scrollbar-width:none;margin:0 -14px;padding:0 14px 8px}.rcs::-webkit-scrollbar{display:none}
.rcs>div{width:88px!important;cursor:pointer;transition:transform .18s}.rcs>div:active{transform:scale(.95)}
.rcs .cv{width:88px!important;height:124px!important;border-radius:14px}
.rcs span{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:.76rem;font-weight:600}
/* সাধারণ উন্নতি */
.card{transition:transform .15s,box-shadow .2s}
.pg>.card,.pg>.hero,.pg>.st{animation:in .4s ease both}
.pg>*:nth-child(2){animation-delay:.04s}.pg>*:nth-child(3){animation-delay:.08s}.pg>*:nth-child(4){animation-delay:.12s}
nav button svg{transition:transform .25s}nav button.on svg{transform:translateY(-1px) scale(1.12)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== নতুন মিনিমাল UI ===== */

 if(STT=='y'){const n=new Date();for(let i=11;i>=0;i--){const d=new Date(n.getFullYear(),n.getMonth()-i,1);keys.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'));lab.push(['জানু','ফেব্রু','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগ','সেপ্টে','অক্টো','নভে','ডিসে'][d.getMonth()])}}
