</style></head><body>
<div id="app"><header><button class="ib" id="bk" onclick="back()"></button><h1 id="ttl" style="flex:1"></h1><button class="ib" onclick="logout()" title="লগআউট">⎋</button></header><main id="main"></main><nav id="nav"></nav></div>
<div id="mod"></div><div id="toast"></div>
<script>
/* ===== Helpers ===== */
const $=s=>document.querySelector(s),bn=n=>Number(n).toLocaleString('bn-BD'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P={home:'M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',book:'M4 4h11a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3zM4 17a3 3 0 0 1 3-3h11',tag:'M3 12V4h8l10 10-8 8zM7.5 7.5h.01',file:'M6 2h9l5 5v15H6zM14 2v6h6M9 13h6M9 17h6',grid:'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z',plus:'M12 5v14M5 12h14',back:'M15 5l-7 7 7 7',edit:'M4 20h4L19 9l-4-4L4 16z',trash:'M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13',eye:'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6',star:'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z',up:'M6 14l6-6 6 6',down:'M6 10l6 6 6-6',audio:'M9 18V5l12-2v13M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM21 16a3 3 0 1 1-6 0 3 3 0 0 1 6 0z',img:'M3 5h18v14H3zM3 16l5-5 4 4 3-3 6 6',bell:'M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 21h4',dl:'M12 3v12M7 10l5 5 5-5M4 21h16',gear:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2',x:'M6 6l12 12M18 6L6 18',swap:'M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7',trend:'M3 17l6-6 4 4 8-8M15 7h6v6',cal:'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4',chk:'M5 12l5 5 9-10',search:'M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14M20 20l-4-4'};
const I=n=>`<svg viewBox="0 0 24 24"><path d="${P[n]}"/></svg>`;
const W=['নদীর','ধারে','ভোরের','আলো','ছড়িয়ে','পড়ছিল','আর','গ্রামের','পথ','ধরে','ধীরে','এগিয়ে','চলছিল','সে'];
const gen=n=>Array.from({length:n},(_,i)=>W[i%W.length]).join(' ');
const MIN=1000,wc=t=>{t=t.trim();return t?t.split(/\s+/).length:0};
const GR=['#2d3a8c,#6a7cf0','#7a2d6b,#d46aa5','#0f6b6b,#4ac2b0','#8a4b10,#e0a050','#2d6b2d,#7ac27a','#3a3a5c,#8a8ab0'];
const nid=()=>Date.now()*10+Math.floor(Math.random()*10);
const cov=(b,c='')=>`<div class="cv ${c}" style="background:linear-gradient(145deg,${GR[b.id%6]})">${b.cover?`<img src="${b.cover}" alt="">`:`<span>${esc(b.title.slice(0,2))}</span>`}</div>`;
const badge=p=>p?'<span class="bg ok">প্রকাশিত</span>':'<span class="bg wr">খসড়া</span>';
const empty=t=>`<div class="emp">${I('book')}<p>${t}</p></div>`;
const fld=(l,id,v='',t='text')=>`<label class="fl">${l}<input id="${id}" type="${t}" value="${esc(v)}"></label>`;

let S={cats:[],books:[],chapters:[],lists:{feat:[],w:[],m:[],y:[]},notifs:[],upd:{vc:'1',vn:'1.0.0',notes:'',url:'',min:'1',must:false},log:[]};const log=t=>{S.log.unshift(t);sync()};
const bk=id=>S.books.find(b=>b.id==id),ct=id=>S.cats.find(c=>c.id==id);
/* ===== Navigation stack ===== */
let stack=[{r:'dash',p:{}}],dirty=false,mdirty=false,modals=[],lastBack=0,V={};
const cur=()=>stack[stack.length-1];
const TABS=[['dash','ড্যাশবোর্ড','home'],['books','বইসমূহ','book'],['cats','ক্যাটাগরি','tag'],['more','আরও','grid']];
const TO={dash:'dash',books:'books',bookDetail:'books',bookForm:'books',read:'books',cats:'cats',catDetail:'cats',chs:'chs',editor:'chs'};
function guard(f){dirty?confirmDlg('অসংরক্ষিত পরিবর্তন আছে। পরিবর্তন বাতিল করে বের হবেন?','থাকুন','বাতিল করুন',()=>{dirty=false;f()}):f()}
function go(r,p={}){guard(()=>{stack.push({r,p});draw()})}
function tab(r){guard(()=>{const i=stack.findIndex(x=>x.r===r);i>=0?stack.length=i+1:stack.push({r,p:{}});draw()})}
function back(){
 if(modals.length)return closeModal();
 if(dirty)return confirmDlg('অসংরক্ষিত পরিবর্তন আছে। পরিবর্তন বাতিল করে বের হবেন?','থাকুন','বাতিল করুন',()=>{dirty=false;back()});
 if(stack.length>1){stack.pop();return draw()}
 const t=Date.now();
 if(t-lastBack<2200){lastBack=0;exitDlg()}else{lastBack=t;toast('অ্যাপ থেকে বের হতে আবার ব্যাক চাপুন')}
}
let armed=0;const arm=()=>{if(armed)return;armed=1;try{history.pushState({s:1},'')}catch(e){}}; // sentinel entry is created after the first user gesture (Chrome ignores history entries made without one)
['pointerdown','touchstart','keydown'].forEach(t=>addEventListener(t,arm,{passive:true}));
window.onNativeBack=()=>back(); // for an Android wrapper: webView.evaluateJavascript("window.onNativeBack&&window.onNativeBack()",null)
addEventListener('popstate',()=>{if(!armed)return;try{history.pushState({s:1},'')}catch(e){}back()}); // single listener, sentinel entry re-pushed
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key=='s'){e.preventDefault();if(cur().r=='editor'&&!modals.length)saveCh(cur().p.id||0)}});
/* ===== Modals / toast ===== */
function openModal(h,g){const el=document.createElement('div');el.className='ov';el.innerHTML=`<div class="sh">${h}</div>`;el.onclick=e=>{if(e.target===el)closeModal()};$('#mod').append(el);const m={el,g};modals.push(m);return el}
function closeModal(force){const m=modals[modals.length-1];if(!m)return;
 if(!force&&m.g&&mdirty)return confirmDlg('সংরক্ষণ না করা পরিবর্তন বাতিল করবেন?','থাকুন','বাতিল করুন',()=>{mdirty=false;closeModal(true)});
 m.el.remove();modals.pop();if(!modals.length)mdirty=false}
let fn1;function confirmDlg(msg,no,yes,fn,danger=1){fn1=fn;openModal(`<h2>নিশ্চিত করুন</h2><p>${msg}</p><div class="btns"><button class="btn s" onclick="closeModal(true)">${no}</button><button class="btn ${danger?'d':''}" onclick="closeModal(true);fn1()">${yes}</button></div>`)}
function exitDlg(){openModal(`<h2>আপনি কি অ্যাপ থেকে বের হতে চান?</h2><div class="btns"><button class="btn s" onclick="closeModal(true)">বাতিল</button><button class="btn d" onclick="doExit()">বের হোন</button></div>`)}
function doExit(){closeModal(true);const B=window.AndroidBridge||window.Android;
 if(B&&typeof B.exitApp=='function')B.exitApp();
 else openModal(`<h2>বের হওয়া সম্ভব নয়</h2><p>এই ব্রাউজার/WebView-এ অ্যাপ বন্ধ করার ব্রিজ (exitApp) নেই, তাই অ্যাপ বন্ধ হয়নি। Android র‍্যাপারে <code>AndroidBridge.exitApp()</code> যুক্ত করতে হবে।</p><button class="btn" onclick="closeModal(true)">ঠিক আছে</button>`)}
let tt;function toast(m){sync();const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2200)}
/* ===== Render ===== */
function draw(keep){sync();const{r,p}=cur(),v=V[r](p);$('#ttl').textContent=v.t;$('#bk').style.display=stack.length>1?'':'none';
 $('#main').innerHTML=`<div class="pg">${v.h}</div>`;if(!keep)scrollTo(0,0);v.i&&v.i();
